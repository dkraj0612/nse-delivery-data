<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free AI Software Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .message-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        
        .dark body { background-color: #111827; }
        .dark .bg-white { background-color: #1f2937; }
        .dark .border-gray-200 { border-color: #374151; }
        .dark .text-gray-800 { color: #e5e7eb; }
        .dark .bg-gray-100 { background-color: #374151; }
        .dark .text-gray-500 { color: #9ca3af; }

        .chip-delete-overlay { display: none; }
        .watchlist-chip:hover .chip-delete-overlay { display: flex; }
    </style>
</head>
<!-- Fix: Changed to h-[100dvh] flex flex-col to prevent mobile safari overlap -->
<body class="h-[100dvh] flex flex-col font-sans text-gray-800 dark:text-gray-200 overflow-hidden">

    <!-- Header -->
    <header class="shrink-0 bg-gray-900 shadow-md p-4 flex items-center justify-between z-20 text-white relative">
        <div class="flex items-center gap-3">
            <button id="menu-btn" class="p-1 rounded hover:bg-gray-800 relative">
                <i class="ph ph-list text-2xl"></i>
                <span id="menu-warning-dot" class="hidden absolute top-0 right-0 w-2.5 h-2.5 bg-amber-500 rounded-full animate-pulse border border-gray-900"></span>
            </button>
            <h1 class="text-xl font-bold flex items-center gap-2 text-blue-400">
                <i class="ph ph-code text-2xl"></i> Free Studio
            </h1>
        </div>
        <div class="flex gap-2">
            <button id="theme-toggle" class="p-2 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-95 transition-transform" title="Toggle Theme">
                <i id="theme-icon" class="ph ph-moon text-xl text-gray-300"></i>
            </button>
            <button id="settings-btn" class="p-2 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-95 transition-transform" title="Vault Settings">
                <i class="ph ph-gear text-xl text-gray-300"></i>
            </button>
            <button id="reset-btn" class="p-2 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-95 transition-transform" title="New Chat">
                <i class="ph ph-trash text-xl text-gray-300"></i>
            </button>
        </div>
    </header>

    <!-- Sidebar (Session Management & Git Vault) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden backdrop-blur-sm transition-opacity opacity-0 duration-300"></div>
    <div id="sidebar" class="fixed inset-y-0 left-0 w-72 max-w-[80vw] bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 z-40 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
        <div class="p-4 border-b border-gray-200 dark:border-gray-800 flex justify-between items-center bg-gray-50 dark:bg-gray-800/50">
            <h2 class="font-bold text-gray-700 dark:text-gray-200">Sessions & Vault</h2>
            <button id="close-sidebar-btn" class="text-gray-500 hover:text-gray-800 dark:hover:text-white"><i class="ph ph-x text-xl"></i></button>
        </div>
        <div class="p-4 border-b border-gray-200 dark:border-gray-800 space-y-3">
            <div class="flex gap-2">
                <button id="git-push-btn" class="flex-1 flex justify-center items-center gap-1.5 bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 border border-green-200 dark:border-green-800/50 py-2 rounded-lg text-xs font-bold transition-all">
                    <i class="ph ph-upload-simple"></i> Push Git
                </button>
                <button id="git-pull-btn" class="flex-1 flex justify-center items-center gap-1.5 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 py-2 rounded-lg text-xs font-bold transition-all animate-pulse">
                    <i class="ph ph-download-simple"></i> Pull Git
                </button>
            </div>
            <div id="sync-status" class="text-center text-[10px] font-mono text-green-600 dark:text-green-400 font-bold uppercase tracking-widest"><i class="ph ph-check-circle"></i> Vault Synced</div>
        </div>
        <div id="session-list" class="flex-1 overflow-y-auto p-2 space-y-1 no-scrollbar"></div>
    </div>

    <!-- Watchlist Bar -->
    <div class="shrink-0 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shadow-sm z-10">
        <div class="flex gap-2 overflow-x-auto no-scrollbar items-center p-2 px-4">
            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest shrink-0 flex items-center gap-1">Watchlist</span>
            <div id="watchlist-chips" class="flex gap-2 items-center"></div>
            <button id="open-add-stock-btn" class="shrink-0 flex items-center gap-1 bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-300 border border-gray-200 dark:border-gray-700 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors">
                <i class="ph ph-plus"></i> Add Target
            </button>
            <div class="flex-1 min-w-[20px]"></div>
            <button id="run-radar-btn" class="shrink-0 flex items-center gap-1.5 bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-400 border border-blue-200 dark:border-blue-800/50 px-4 py-1.5 rounded-full text-xs font-bold tracking-widest uppercase transition-colors shadow-sm">
                <i class="ph ph-broadcast animate-pulse text-sm"></i> Radar Scan
            </button>
        </div>
    </div>

    <!-- Main Chat Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar relative bg-gray-50 dark:bg-[#111827]">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3 opacity-60" id="welcome-screen">
            <i class="ph ph-terminal-window text-5xl mb-2 text-gray-400"></i>
            <h2 class="text-lg font-medium text-gray-700 dark:text-gray-300">Ready for Analysis</h2>
            <p class="text-sm px-8 text-gray-500">Git Vault active.<br>Toggle Forensic mode below for structured JSON reports.</p>
        </div>
    </main>

    <!-- Footer Input Area -->
    <footer class="shrink-0 bg-white dark:bg-gray-900 border-t border-gray-200 dark:border-gray-700 pb-[max(0.75rem,env(safe-area-inset-bottom))] pt-2 px-2">
        <div id="attachment-preview" class="hidden px-2 pb-2 flex gap-2 overflow-x-auto no-scrollbar items-center"></div>
        <form id="search-form" class="relative flex items-center gap-2 max-w-2xl mx-auto px-2">
            
            <input type="file" id="file-upload" class="hidden" accept="image/*,.txt,.csv,.json,.py,.js,.html,.css,.md,.cpp,.java" multiple>
            <button type="button" id="attach-btn" class="shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors active:scale-95">
                <i class="ph ph-paperclip text-xl"></i>
            </button>

            <!-- Dual-Mode Toggle -->
            <button type="button" id="mode-toggle-btn" class="shrink-0 flex items-center gap-1.5 px-3 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 font-bold text-xs uppercase tracking-wider transition-colors focus:outline-none">
                <i class="ph ph-chat-circle-dots text-lg" id="mode-icon"></i>
                <span class="hidden sm:block" id="mode-text">General</span>
            </button>

            <input type="text" id="search-input" placeholder="Message Gemini..." class="flex-1 bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl py-2.5 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-900 dark:text-white" autocomplete="off">
            
            <button type="submit" id="submit-btn" class="shrink-0 w-10 h-10 bg-blue-600 text-white rounded-xl flex items-center justify-center shadow-md active:scale-95 transition-transform disabled:opacity-50 disabled:bg-gray-400">
                <i class="ph ph-paper-plane-right text-xl"></i>
            </button>
        </form>
    </footer>

    <!-- Settings / Git Vault Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-[slideUp_0.2s_ease-out]">
            <div class="bg-gray-900 p-4 border-b border-gray-800 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="ph ph-github-logo text-blue-400"></i> Git Vault Setup
                </h3>
                <button id="close-settings-btn" class="text-gray-400 hover:text-white"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4">
                <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">Securely backup your analysis sessions to a private GitHub repository.</p>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">GitHub Token (Classic)</label>
                    <input type="password" id="git-token-input" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="ghp_...">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Username</label>
                        <input type="text" id="git-user-input" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="JohnDoe">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Repository</label>
                        <input type="text" id="git-repo-input" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg py-2 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="my-vault">
                    </div>
                </div>
                <button id="save-settings-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors shadow mt-2">
                    Save Vault Config
                </button>
            </div>
        </div>
    </div>

    <!-- Add Stock Modal -->
    <div id="add-stock-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-[slideUp_0.2s_ease-out] p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-gray-800 dark:text-gray-200">Add Watchlist Target</h3>
                <button id="close-add-stock-btn" class="text-gray-400 hover:text-gray-800 dark:hover:text-white"><i class="ph ph-x text-xl"></i></button>
            </div>
            <input type="text" id="new-stock-input" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-4 py-3 text-sm text-gray-900 dark:text-white font-mono focus:border-blue-500 focus:outline-none mb-4" placeholder="TICKER (e.g. AAPL)">
            <button id="save-stock-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg text-sm hover:bg-blue-700 transition-colors shadow">Append to Watchlist</button>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CONSTANTS & INJECTIONS
        // ==========================================
        const apiKey = ""; // Enforced empty string for preview environment injection
        localforage.config({ name: 'FreeStudio', storeName: 'vault_data' });

        // State
        let isForensicMode = false;
        let currentSessionId = Date.now().toString();
        let savedSessions = {};
        let localStocks = ["RELIANCE", "TCS", "INFY"];
        let currentHistory = [];
        let attachedFilesContent = [];
        let hasUnsyncedChanges = false;
        
        // Massive prompts isolated completely from conversational history
        const MASTER_PROMPT = `You are an elite Institutional Forensic Analyst. Output STRICTLY VALID JSON. NO markdown blocks outside JSON. Schema: { "metadata": { "company_name": "", "ticker": "", "classification": "", "analysis_date": "" }, "kpis": { "market_cap": "", "pe_ratio": "", "roe": "", "debt_to_equity": "", "final_verdict": "STRONG BUY / HOLD / AVOID" }, "governance": { "promoter_integrity": "", "red_flags": "" }, "financial_forensics": { "revenue_quality": "", "hidden_debt": "" }, "catalysts_and_sentiment": { "upcoming_triggers": "" } }`;
        const RADAR_PROMPT = `Use Google Search to scan the latest institutional news, bulk deals, or earnings (last 24-48 hrs). OUTPUT STRICTLY VALID JSON. Schema: { "radar_date": "Today's Date", "market_sentiment_summary": "1-2 sentence overview", "stock_updates": [ { "ticker": "STOCK_NAME", "news_summary": "2-3 crisp bullet points", "sentiment": "Positive / Negative / Neutral", "severity": "High / Medium / Low" } ] }`;

        // ==========================================
        // 2. THEME LOGIC
        // ==========================================
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeIcon.classList.replace('ph-moon', 'ph-sun');
            }
        }

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.classList.replace('ph-moon', 'ph-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.classList.replace('ph-sun', 'ph-moon');
                localStorage.setItem('theme', 'light');
            }
        });
        initTheme();

        // ==========================================
        // 3. INITIALIZATION & STORAGE
        // ==========================================
        async function initApp() {
            try {
                const storedSessions = await localforage.getItem('sessions');
                if (storedSessions) savedSessions = storedSessions;
                const storedStocks = await localforage.getItem('watchlist');
                if (storedStocks) localStocks = storedStocks;
                
                renderWatchlist();
                renderSidebar();
                if (Object.keys(savedSessions).length > 0) {
                    loadSession(Object.keys(savedSessions).sort((a,b) => savedSessions[b].updatedAt - savedSessions[a].updatedAt)[0]);
                }
                setTimeout(() => document.getElementById('git-pull-btn').classList.remove('animate-pulse'), 5000);
            } catch (e) { console.error("DB Load Error", e); }
        }

        function triggerDirtyState() {
            hasUnsyncedChanges = true;
            document.getElementById('menu-warning-dot').classList.remove('hidden');
            const status = document.getElementById('sync-status');
            status.className = "text-center text-[10px] font-mono text-amber-500 font-bold uppercase tracking-widest animate-pulse";
            status.innerHTML = '<i class="ph ph-warning"></i> Unsynced Changes';
        }

        function clearDirtyState() {
            hasUnsyncedChanges = false;
            document.getElementById('menu-warning-dot').classList.add('hidden');
            const status = document.getElementById('sync-status');
            status.className = "text-center text-[10px] font-mono text-green-600 dark:text-green-400 font-bold uppercase tracking-widest";
            status.innerHTML = '<i class="ph ph-check-circle"></i> Vault Synced';
        }

        async function saveSessionLocal(role, text) {
            if (!savedSessions[currentSessionId]) {
                let title = text.replace(/<[^>]*>?/gm, '').substring(0, 25) + "..."; 
                if (role !== 'user') title = "New Chat";
                savedSessions[currentSessionId] = { id: currentSessionId, title: title, history: [], updatedAt: Date.now() };
            }
            savedSessions[currentSessionId].history.push({ role, text });
            savedSessions[currentSessionId].updatedAt = Date.now();
            await localforage.setItem('sessions', savedSessions);
            triggerDirtyState();
            renderSidebar();
        }

        // ==========================================
        // 4. UI CONTROLS (Sidebar, Watchlist, Modes)
        // ==========================================
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        document.getElementById('menu-btn').onclick = () => { sidebar.classList.remove('-translate-x-full'); sidebarOverlay.classList.remove('hidden'); setTimeout(() => sidebarOverlay.classList.remove('opacity-0'), 10); };
        const closeSidebar = () => { sidebar.classList.add('-translate-x-full'); sidebarOverlay.classList.add('opacity-0'); setTimeout(() => sidebarOverlay.classList.add('hidden'), 300); };
        document.getElementById('close-sidebar-btn').onclick = closeSidebar; sidebarOverlay.onclick = closeSidebar;

        document.getElementById('reset-btn').onclick = () => {
            currentSessionId = Date.now().toString();
            currentHistory = [];
            Array.from(document.getElementById('chat-container').children).forEach(c => { if(c.id !== 'welcome-screen') c.remove(); });
            document.getElementById('welcome-screen').style.display = 'flex';
        };

        const modeToggleBtn = document.getElementById('mode-toggle-btn');
        const searchInput = document.getElementById('search-input');
        modeToggleBtn.onclick = () => {
            isForensicMode = !isForensicMode;
            if (isForensicMode) {
                modeToggleBtn.className = "shrink-0 flex items-center gap-1.5 px-3 h-10 rounded-xl bg-blue-100 dark:bg-blue-900/30 border border-blue-200 dark:border-blue-800 text-blue-700 dark:text-blue-400 font-bold text-xs uppercase tracking-wider transition-colors focus:outline-none";
                document.getElementById('mode-icon').className = "ph ph-radar text-lg"; document.getElementById('mode-text').innerText = "Forensic"; searchInput.placeholder = "Analyze asset (e.g. AAPL)...";
            } else {
                modeToggleBtn.className = "shrink-0 flex items-center gap-1.5 px-3 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-600 dark:text-gray-300 font-bold text-xs uppercase tracking-wider transition-colors focus:outline-none";
                document.getElementById('mode-icon').className = "ph ph-chat-circle-dots text-lg"; document.getElementById('mode-text').innerText = "General"; searchInput.placeholder = "Message Gemini...";
            }
        };

        // Watchlist Rendering
        function renderWatchlist() {
            const container = document.getElementById('watchlist-chips');
            container.innerHTML = '';
            localStocks.forEach(stock => {
                const div = document.createElement('div');
                div.className = "watchlist-chip relative shrink-0 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest cursor-pointer overflow-hidden shadow-sm transition-colors";
                div.textContent = stock;
                div.onclick = (e) => {
                    if (e.target.closest('.chip-delete-overlay')) return;
                    if (!isForensicMode) modeToggleBtn.click();
                    searchInput.value = stock;
                    document.getElementById('search-form').dispatchEvent(new Event('submit'));
                };
                
                const delOverlay = document.createElement('div');
                delOverlay.className = "chip-delete-overlay absolute inset-0 bg-red-500/90 items-center justify-center text-white cursor-pointer";
                delOverlay.innerHTML = '<i class="ph ph-trash"></i>';
                delOverlay.onclick = async (e) => { e.stopPropagation(); localStocks = localStocks.filter(s => s !== stock); await localforage.setItem('watchlist', localStocks); triggerDirtyState(); renderWatchlist(); };
                div.appendChild(delOverlay); container.appendChild(div);
            });
        }

        document.getElementById('open-add-stock-btn').onclick = () => document.getElementById('add-stock-modal').classList.remove('hidden');
        document.getElementById('close-add-stock-btn').onclick = () => document.getElementById('add-stock-modal').classList.add('hidden');
        document.getElementById('save-stock-btn').onclick = async () => {
            const val = document.getElementById('new-stock-input').value.trim().toUpperCase();
            if (val && !localStocks.includes(val)) { localStocks.push(val); await localforage.setItem('watchlist', localStocks); triggerDirtyState(); renderWatchlist(); }
            document.getElementById('new-stock-input').value = '';
            document.getElementById('add-stock-modal').classList.add('hidden');
        };

        // Sidebar Rendering
        function renderSidebar() {
            const list = document.getElementById('session-list');
            list.innerHTML = '';
            const sorted = Object.values(savedSessions).sort((a,b) => b.updatedAt - a.updatedAt);
            sorted.forEach(s => {
                const div = document.createElement('div');
                div.className = `flex justify-between items-center group px-3 py-3 rounded-lg text-sm cursor-pointer transition-colors ${s.id === currentSessionId ? 'bg-gray-200 dark:bg-gray-800 text-gray-900 dark:text-white font-bold' : 'text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800/50'}`;
                div.innerHTML = `<span class="truncate flex-1">${s.title}</span>`;
                div.onclick = () => loadSession(s.id);
                
                const del = document.createElement('button');
                del.className = "opacity-0 group-hover:opacity-100 text-gray-400 hover:text-red-500 p-1 focus:opacity-100";
                del.innerHTML = '<i class="ph ph-trash"></i>';
                del.onclick = async (e) => {
                    e.stopPropagation(); delete savedSessions[s.id]; await localforage.setItem('sessions', savedSessions); triggerDirtyState();
                    if (currentSessionId === s.id) document.getElementById('reset-btn').click(); else renderSidebar();
                };
                div.appendChild(del); list.appendChild(div);
            });
        }

        function loadSession(id) {
            if (!savedSessions[id]) return;
            currentSessionId = id;
            currentHistory = [];
            Array.from(document.getElementById('chat-container').children).forEach(c => { if(c.id !== 'welcome-screen') c.remove(); });
            document.getElementById('welcome-screen').style.display = 'none';
            
            savedSessions[id].history.forEach(msg => {
                const isHtml = msg.text.includes('<span') || msg.text.includes('<i class');
                if (msg.role === 'user' && isHtml) addMessageToDOM('user', msg.text, true); 
                else addMessageToDOM(msg.role, msg.text);
            });
            closeSidebar();
            renderSidebar();
        }

        // ==========================================
        // 5. GIT VAULT LOGIC
        // ==========================================
        document.getElementById('settings-btn').onclick = () => {
            document.getElementById('git-token-input').value = localStorage.getItem('fs_git_token') || "";
            document.getElementById('git-user-input').value = localStorage.getItem('fs_git_user') || "";
            document.getElementById('git-repo-input').value = localStorage.getItem('fs_git_repo') || "";
            document.getElementById('settings-modal').classList.remove('hidden');
        };
        document.getElementById('close-settings-btn').onclick = () => document.getElementById('settings-modal').classList.add('hidden');
        document.getElementById('save-settings-btn').onclick = () => {
            localStorage.setItem('fs_git_token', document.getElementById('git-token-input').value.trim());
            localStorage.setItem('fs_git_user', document.getElementById('git-user-input').value.trim());
            localStorage.setItem('fs_git_repo', document.getElementById('git-repo-input').value.trim());
            document.getElementById('settings-modal').classList.add('hidden');
        };

        function utoa(str) { return btoa(unescape(encodeURIComponent(str))); }
        function atou(str) { return decodeURIComponent(escape(atob(str))); }

        async function gitSync(action) {
            const token = localStorage.getItem('fs_git_token');
            const owner = localStorage.getItem('fs_git_user');
            const repo = localStorage.getItem('fs_git_repo');
            if (!token || !owner || !repo) return document.getElementById('settings-modal').classList.remove('hidden');

            const path = "vault_backup.json";
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const btn = action === 'push' ? document.getElementById('git-push-btn') : document.getElementById('git-pull-btn');
            
            btn.innerHTML = `<i class="ph ph-circle-notch animate-spin"></i> ${action === 'push' ? 'Pushing...' : 'Pulling...'}`;

            try {
                let sha = null; let existingContent = null;
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                if (getRes.ok) { const data = await getRes.json(); sha = data.sha; existingContent = data.content; }

                if (action === 'push') {
                    const payload = { sessions: savedSessions, stocks: localStocks, timestamp: Date.now() };
                    const body = { message: `Vault Sync`, content: utoa(JSON.stringify(payload)) };
                    if (sha) body.sha = sha;
                    const putRes = await fetch(apiUrl, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    if (!putRes.ok) throw new Error("Push Failed.");
                    clearDirtyState();
                    btn.innerHTML = `<i class="ph ph-check"></i> Success`;
                } else if (action === 'pull') {
                    if (!sha) throw new Error("No backup found.");
                    const payload = JSON.parse(atou(existingContent));
                    if (payload.sessions) savedSessions = payload.sessions;
                    if (payload.stocks) localStocks = payload.stocks;
                    await localforage.setItem('sessions', savedSessions);
                    await localforage.setItem('watchlist', localStocks);
                    renderSidebar(); renderWatchlist();
                    if(Object.keys(savedSessions).length > 0) loadSession(Object.keys(savedSessions).sort((a,b)=>savedSessions[b].updatedAt-savedSessions[a].updatedAt)[0]);
                    clearDirtyState();
                    document.getElementById('git-pull-btn').classList.remove('animate-pulse');
                    btn.innerHTML = `<i class="ph ph-check"></i> Restored`;
                }
            } catch (err) { btn.innerHTML = `<i class="ph ph-warning-circle"></i> Error`; } 
            finally { setTimeout(() => { btn.innerHTML = `<i class="ph ph-${action === 'push' ? 'upload' : 'download'}-simple"></i> ${action === 'push' ? 'Push' : 'Pull'} Git`; }, 2000); }
        }
        document.getElementById('git-push-btn').onclick = () => gitSync('push'); document.getElementById('git-pull-btn').onclick = () => gitSync('pull');

        // ==========================================
        // 6. API EXECUTION & CONTEXT BLOAT FIX
        // ==========================================
        async function fetchGeminiWithBackoff(payload) {
            const maxRetries = 5; const delays = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || "API Failed");
                    return data;
                } catch (error) { if (i === maxRetries) throw error; await new Promise(r => setTimeout(r, delays[i])); }
            }
        }

        document.getElementById('search-form').onsubmit = async (e) => {
            e.preventDefault();
            const q = searchInput.value.trim();
            if (!q) return;

            addMessageToDOM("user", q);
            searchInput.value = "";
            document.getElementById('submit-btn').disabled = true;

            let contentsArray = [];
            let sysInstruction = "";

            if (isForensicMode) {
                // TOKEN BLOAT FIX: Isolated inference. No history sent.
                contentsArray = [{ role: "user", parts: [{ text: `Target: ${q}` }] }];
                sysInstruction = MASTER_PROMPT;
            } else {
                // GENERAL MODE: Send rolling history
                const rolling = currentHistory.slice(-4).map(msg => ({ role: msg.role === 'ai' ? 'model' : 'user', parts: [{ text: msg.text }] }));
                rolling.push({ role: "user", parts: [{ text: q }] });
                contentsArray = rolling;
                sysInstruction = "You are a helpful software assistant. Use markdown.";
            }

            saveSessionLocal("user", q);
            if(!isForensicMode) currentHistory.push({role: 'user', text: q});
            await triggerAI(contentsArray, sysInstruction);
        };

        document.getElementById('run-radar-btn').onclick = async () => {
            if (localStocks.length === 0) return alert("Watchlist is empty.");
            if (!isForensicMode) modeToggleBtn.click();
            
            const promptText = `Watchlist: ${localStocks.join(', ')}. Date: ${new Date().toISOString().split('T')[0]}`;
            const uiText = `RUN RADAR: Scrape Live News for ${localStocks.length} Stocks`;
            
            addMessageToDOM("user", `<span class="text-blue-600 dark:text-blue-400 font-bold flex items-center gap-2"><i class="ph ph-broadcast animate-pulse"></i> ${uiText}</span>`, true);
            saveSessionLocal("user", uiText);

            const contentsArray = [{ role: "user", parts: [{ text: promptText }] }];
            await triggerAI(contentsArray, RADAR_PROMPT);
        };

        async function triggerAI(contentsArray, sysInstruction) {
            const payload = {
                contents: contentsArray,
                systemInstruction: { parts: [{ text: sysInstruction }] },
                generationConfig: { temperature: 0.1 },
                tools: [{ google_search: {} }] 
            };

            const loaderId = showLoadingUI();
            try {
                const data = await fetchGeminiWithBackoff(payload);
                document.getElementById(loaderId)?.remove();
                const responseText = data.candidates[0].content.parts[0].text;
                addMessageToDOM("ai", responseText);
                saveSessionLocal("ai", responseText);
                if(!isForensicMode) currentHistory.push({role: 'ai', text: responseText});
            } catch (err) {
                document.getElementById(loaderId)?.remove();
                addMessageToDOM("ai", `**System Error:** ${err.message}`);
            } finally {
                document.getElementById('submit-btn').disabled = false;
            }
        }

        // ==========================================
        // 7. RENDERERS & FORMATTERS
        // ==========================================
        function showLoadingUI() {
            const id = 'loader-' + Date.now();
            const container = document.getElementById('chat-container');
            const div = document.createElement('div'); div.id = id; div.className = "flex w-full justify-start message-enter";
            div.innerHTML = `<div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-4 py-3 rounded-xl rounded-bl-sm shadow-sm flex items-center gap-2"><div class="text-xs text-gray-500 dark:text-gray-400 font-mono">Scanning live data...</div><div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div></div>`;
            container.appendChild(div); container.scrollTop = container.scrollHeight; return id;
        }

        function addMessageToDOM(role, text, isRawHtml = false) {
            document.getElementById('welcome-screen').style.display = 'none';
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full message-enter ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            
            if (role === 'user') {
                bubble.className = 'bg-gray-800 text-white px-5 py-3 rounded-xl rounded-br-sm max-w-[85%] text-base shadow-sm';
                bubble.innerHTML = isRawHtml ? text : text.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
            } else {
                bubble.className = 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 px-4 py-4 rounded-xl rounded-bl-sm w-full text-sm shadow-sm leading-relaxed overflow-x-hidden';
                bubble.innerHTML = formatAIText(text);
            }
            msgDiv.appendChild(bubble); container.appendChild(msgDiv); container.scrollTop = container.scrollHeight;
        }

        function formatAIText(text) {
            if (!text) return '';
            try {
                let cleaned = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                const start = cleaned.indexOf('{'); const end = cleaned.lastIndexOf('}');
                if (start !== -1 && end !== -1 && end > start) {
                    const parsed = JSON.parse(cleaned.substring(start, end + 1));
                    if (parsed.stock_updates) return buildRadarHTML(parsed);
                    if (parsed.kpis) return buildForensicHTML(parsed);
                }
            } catch (e) {}
            return `<div class="prose dark:prose-invert max-w-none text-sm leading-relaxed">${marked.parse(text)}</div>`;
        }

        function buildForensicHTML(obj) {
            let html = '<div class="flex flex-col gap-4 font-sans">';
            if (obj.metadata) {
                let verdictStyle = "border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700";
                if (obj.kpis?.final_verdict?.includes('BUY')) verdictStyle = "border-green-300 dark:border-green-800/50 text-green-700 dark:text-green-400 bg-green-50 dark:bg-green-900/30";
                if (obj.kpis?.final_verdict?.includes('AVOID')) verdictStyle = "border-red-300 dark:border-red-800/50 text-red-700 dark:text-red-400 bg-red-50 dark:bg-red-900/30";
                html += `<div class="bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3"><div class="flex-1"><h2 class="text-xl font-bold text-gray-900 dark:text-white">${obj.metadata.company_name}</h2><p class="text-xs font-mono text-blue-600 dark:text-blue-400 mt-1">${obj.metadata.ticker} • ${obj.metadata.classification}</p></div><div class="px-4 py-2 border rounded-lg text-xs font-bold uppercase tracking-widest w-full sm:w-auto text-center ${verdictStyle}">${obj.kpis?.final_verdict || 'N/A'}</div></div>`;
            }
            if (obj.kpis) {
                html += `<div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                for (const [k, v] of Object.entries(obj.kpis)) { if (k === 'final_verdict') continue; html += `<div class="bg-gray-50 dark:bg-gray-800/50 border border-gray-200 dark:border-gray-700 p-3 rounded-lg shadow-sm"><div class="text-[9px] text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-1 font-bold">${k.replace(/_/g, ' ')}</div><div class="text-sm font-mono text-gray-900 dark:text-gray-100">${v}</div></div>`; }
                html += `</div>`;
            }
            ['governance', 'financial_forensics', 'catalysts_and_sentiment'].forEach(sec => {
                if (obj[sec]) {
                    html += `<div class="border border-gray-200 dark:border-gray-700 rounded-xl overflow-hidden shadow-sm"><div class="bg-gray-100 dark:bg-gray-800 px-4 py-2.5 border-b border-gray-200 dark:border-gray-700"><h3 class="text-xs font-bold text-gray-700 dark:text-gray-300 uppercase tracking-wider">${sec.replace(/_/g, ' ')}</h3></div><div class="p-4 space-y-4 bg-white dark:bg-gray-900/50">`;
                    for (const [k, v] of Object.entries(obj[sec])) { html += `<div class="border-l-2 border-gray-300 dark:border-gray-600 pl-3"><h4 class="text-[10px] font-mono text-gray-500 dark:text-gray-400 uppercase mb-1 font-bold">${k.replace(/_/g, ' ')}</h4><p class="text-sm text-gray-800 dark:text-gray-300 whitespace-pre-wrap leading-relaxed">${v}</p></div>`; }
                    html += `</div></div>`;
                }
            }); return html + '</div>';
        }

        function buildRadarHTML(obj) {
            let html = `<div class="flex flex-col gap-4 font-sans"><div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-900/50 rounded-xl p-5 shadow-sm"><h2 class="text-lg font-bold text-blue-800 dark:text-blue-300 flex items-center gap-2"><i class="ph ph-broadcast text-xl"></i> Pre-Market Radar: ${obj.radar_date}</h2><p class="text-sm text-blue-700 dark:text-blue-200/80 mt-2">${obj.market_sentiment_summary}</p></div><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
            if (obj.stock_updates) {
                obj.stock_updates.forEach(s => {
                    let b = "bg-gray-100 dark:bg-gray-800 text-gray-600 dark:text-gray-400 border-gray-200 dark:border-gray-700", border = "border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800/50";
                    if (s.sentiment === "Negative" || s.severity === "High") { b = "bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 border-red-200 dark:border-red-800/50"; border = "border-red-200 dark:border-red-900/30 bg-white dark:bg-gray-800/50"; } else if (s.sentiment === "Positive") { b = "bg-green-50 dark:bg-green-900/30 text-green-600 dark:text-green-400 border-green-200 dark:border-green-800/50"; border = "border-green-200 dark:border-green-900/30 bg-white dark:bg-gray-800/50"; }
                    html += `<div class="border ${border} p-4 rounded-xl flex flex-col shadow-sm"><div class="flex justify-between items-start mb-3 gap-2"><h3 class="font-bold text-gray-900 dark:text-gray-100 font-mono">${s.ticker}</h3><span class="text-[9px] uppercase tracking-widest font-bold px-2 py-1 rounded-md border ${b} shrink-0 text-center">${s.sentiment} • ${s.severity}</span></div><p class="text-[13px] text-gray-700 dark:text-gray-300 whitespace-pre-wrap leading-relaxed">${s.news_summary}</p></div>`;
                });
            } return html + '</div></div>';
        }

        initApp();
    </script>
</body>
