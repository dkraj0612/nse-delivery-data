
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forensic Studio (Offline/Cloud Ready)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>body { background-color: #09090b; color: #e4e4e7; }</style>
</head>
<body class="h-screen flex flex-col font-sans overflow-hidden">

    <div id="auth-screen" class="fixed inset-0 z-50 bg-zinc-950 flex items-center justify-center p-4">
        <form id="auth-form" class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-8">
            <h2 class="text-xl font-bold mb-6 text-center text-white">SYSTEM ACCESS</h2>
            <input type="text" id="auth-username" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg p-3 mb-4 text-white" placeholder="OPERATOR ID" required>
            <button type="submit" class="w-full bg-indigo-600 py-3 rounded-lg font-bold text-white">AUTHENTICATE</button>
        </form>
    </div>

    <div id="main-app" class="hidden h-screen flex flex-col">
        <header class="border-b border-zinc-800 p-4 flex justify-between items-center">
            <h1 class="font-bold tracking-tight">FORENSIC STUDIO</h1>
            <div class="flex gap-2">
                <button id="admin-panel-btn" class="hidden text-amber-500 hover:text-amber-300">ADMIN</button>
                <button id="logout-btn" class="text-zinc-500 hover:text-rose-400">LOCK</button>
            </div>
        </header>
        <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4"></main>
        <footer class="p-4 border-t border-zinc-800">
            <form id="search-form" class="flex gap-2">
                <input type="text" id="search-input" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-lg px-4 py-3 text-white" placeholder="Analyze asset...">
                <button type="submit" class="bg-indigo-600 px-6 rounded-lg font-bold text-white">RUN</button>
            </form>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const apiKey = "";
        const configStr = typeof __firebase_config !== 'undefined' ? __firebase_config : '{}';
        const isFirebaseReady = configStr !== '{}' && configStr !== "";
        
        let db, user, isMock = !isFirebaseReady;

        if (isFirebaseReady) {
            const app = initializeApp(JSON.parse(configStr));
            db = getFirestore(app);
            const auth = getAuth(app);
            onAuthStateChanged(auth, (u) => { if (u) { user = u; showApp(); loadHistory(); } });
            document.getElementById('auth-form').onsubmit = (e) => { e.preventDefault(); signInAnonymously(auth); };
        } else {
            document.getElementById('auth-form').onsubmit = (e) => { e.preventDefault(); showApp(); loadHistory(); };
        }

        function showApp() {
            const id = document.getElementById('auth-username').value;
            if (id.toUpperCase() === 'ADMIN') document.getElementById('admin-panel-btn').classList.remove('hidden');
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
        }

        document.getElementById('search-form').onsubmit = async (e) => {
            e.preventDefault();
            const input = document.getElementById('search-input');
            const q = input.value;
            addMessage("user", q);
            input.value = "";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: `Analyze: ${q}` }] }] })
                });
                const data = await res.json();
                const a = data.candidates[0].content.parts[0].text;
                addMessage("ai", a);
                save(q, a);
            } catch (err) { addMessage("ai", "Analysis failed (Check API Key)."); }
        };

        function save(q, a) {
            const data = { q, a, t: Date.now() };
            if (isMock) {
                const history = JSON.parse(localStorage.getItem('forensic_mock') || '[]');
                history.push(data);
                localStorage.setItem('forensic_mock', JSON.stringify(history));
            } else {
                // Cloud logic would go here
            }
        }

        function loadHistory() {
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            const history = isMock ? JSON.parse(localStorage.getItem('forensic_mock') || '[]') : [];
            history.forEach(d => { addMessage("user", d.q); addMessage("ai", d.a); });
        }

        function addMessage(role, text) {
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `p-4 rounded-lg ${role === 'user' ? 'bg-zinc-800' : 'bg-indigo-900/20'}`;
            div.innerHTML = marked.parse(text);
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        document.getElementById('logout-btn').onclick = () => location.reload();
    </script>
</body>
</html>
