<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free AI Software Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .message-enter { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }
        .dark body { background-color: #111827; }
        .dark .bg-white { background-color: #1f2937; }
        .dark .border-gray-200 { border-color: #374151; }
        .dark .text-gray-800 { color: #e5e7eb; }
        .dark .bg-gray-100 { background-color: #374151; }
        .dark .text-gray-500 { color: #9ca3af; }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-gray-800 dark:text-gray-200">

    <header class="bg-gray-900 shadow-md p-4 flex items-center justify-between sticky top-0 z-10 text-white">
        <h1 class="text-xl font-bold flex items-center gap-2 text-blue-400">
            <i class="ph ph-code text-2xl"></i>
            Free Studio
        </h1>
        <div class="flex gap-2">
            <button id="theme-toggle" class="p-2 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-95 transition-transform" title="Toggle Theme">
                <i id="theme-icon" class="ph ph-moon text-xl text-gray-300"></i>
            </button>
            <button id="settings-btn" class="p-2 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-95 transition-transform" title="API Settings">
                <i class="ph ph-gear text-xl text-gray-300"></i>
            </button>
            <button id="reset-btn" class="p-2 rounded-full bg-gray-800 hover:bg-gray-700 active:scale-95 transition-transform" title="New Chat">
                <i class="ph ph-trash text-xl text-gray-300"></i>
            </button>
        </div>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar pb-32">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3 opacity-60" id="welcome-screen">
            <i class="ph ph-terminal-window text-5xl mb-2"></i>
            <h2 class="text-lg font-medium">Ready to Build Software</h2>
            <p class="text-sm px-8">Powered by Google Gemini (Free Tier).<br>Attach screenshots & code files freely.</p>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 dark:bg-gray-900 dark:border-gray-700 pb-safe">
        <div id="attachment-preview" class="hidden px-4 py-2 bg-gray-50 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex gap-2 overflow-x-auto no-scrollbar items-center">
        </div>

        <form id="search-form" class="relative flex items-center gap-2 max-w-lg mx-auto p-3">
            <input type="file" id="file-upload" class="hidden" accept="image/*,.txt,.csv,.json,.py,.js,.html,.css,.md,.cpp,.java" multiple>
            
            <button type="button" id="attach-btn" class="w-10 h-10 rounded-full flex items-center justify-center text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors active:scale-95">
                <i class="ph ph-paperclip text-2xl"></i>
            </button>

            <input 
                type="text" 
                id="search-input" 
                placeholder="Message Gemini..." 
                class="w-full bg-gray-100 dark:bg-gray-700 rounded-xl py-3 px-4 text-base focus:outline-none focus:ring-2 focus:ring-blue-500"
                autocomplete="off"
            >
            
            <button 
                type="submit" 
                id="submit-btn"
                class="w-10 h-10 bg-blue-600 text-white rounded-xl flex shrink-0 items-center justify-center shadow-md active:scale-95 transition-transform disabled:opacity-50 disabled:bg-gray-400"
            >
                <i class="ph ph-paper-plane-right text-xl"></i>
            </button>
        </form>
    </footer>

    <!-- API Settings Modal -->
    <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center modal-overlay p-4">
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-sm overflow-hidden animate-[slideUp_0.2s_ease-out]">
            <div class="bg-gray-900 p-4 border-b border-gray-800 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <i class="ph ph-key text-blue-400"></i> Free API Setup
                </h3>
                <button id="close-settings-btn" class="text-gray-400 hover:text-white">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <p class="text-sm text-gray-600 dark:text-gray-400">Get a free key from <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-blue-600 underline">Google AI Studio</a> to unlock unlimited access.</p>
                <div>
                    <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 uppercase mb-1">Google Gemini API Key</label>
                    <input type="password" id="api-key-input" class="w-full bg-gray-100 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg py-2 px-3 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="AIzaSy...">
                </div>
                <button id="save-settings-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors">
                    Save Key Securely
                </button>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const submitBtn = document.getElementById('submit-btn');
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');
        const resetBtn = document.getElementById('reset-btn');
        
        const attachBtn = document.getElementById('attach-btn');
        const fileUpload = document.getElementById('file-upload');
        const attachmentPreview = document.getElementById('attachment-preview');

        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettingsBtn = document.getElementById('close-settings-btn');
        const saveSettingsBtn = document.getElementById('save-settings-btn');
        const apiKeyInput = document.getElementById('api-key-input');

        // Dark mode
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeIcon.classList.remove('ph-moon');
                themeIcon.classList.add('ph-sun');
            }
        }

        themeToggle.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            if (document.documentElement.classList.contains('dark')) {
                themeIcon.classList.remove('ph-moon');
                themeIcon.classList.add('ph-sun');
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.classList.remove('ph-sun');
                themeIcon.classList.add('ph-moon');
                localStorage.setItem('theme', 'light');
            }
        });

        let conversationHistory = [];
        let attachedFilesContent = []; 
        window.generatedFiles = {}; 

        // ===================================================================
        // 1. SECURE API KEY MANAGEMENT
        // ===================================================================
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        } else {
            settingsModal.classList.remove('hidden');
        }

        settingsBtn.addEventListener('click', () => settingsModal.classList.remove('hidden'));
        closeSettingsBtn.addEventListener('click', () => settingsModal.classList.add('hidden'));
        
        saveSettingsBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                settingsModal.classList.add('hidden');
                addMessage("API Key saved securely. System ready.", false);
            }
        });

        function getApiKey() {
            return localStorage.getItem('gemini_api_key');
        }

        // ===================================================================
        // 2. ATTACHMENT & UI LOGIC
        // ===================================================================
        attachBtn.addEventListener('click', () => fileUpload.click());

        fileUpload.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            
            for (const file of files) {
                const isImage = file.type.startsWith('image/');
                const reader = new FileReader();

                reader.onload = (event) => {
                    const content = event.target.result;
                    
                    let dataToStore = content;
                    if (isImage) {
                        dataToStore = content.split(',')[1];
                    }

                    attachedFilesContent.push({
                        name: file.name,
                        data: dataToStore,
                        isImage: isImage,
                        mimeType: file.type,
                        rawContent: content 
                    });

                    attachmentPreview.classList.remove('hidden');
                    const pill = document.createElement('div');
                    pill.className = "flex items-center gap-2 bg-blue-50 dark:bg-blue-950 text-blue-700 dark:text-blue-300 px-3 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap border border-blue-200 dark:border-blue-800 shadow-sm";
                    
                    if (isImage) {
                        pill.innerHTML = `<img src="${content}" class="w-6 h-6 object-cover rounded shadow-sm border border-blue-100"> <span>${file.name}</span>`;
                    } else {
                        pill.innerHTML = `<i class="ph ph-file-code text-lg"></i> <span>${file.name}</span>`;
                    }
                    attachmentPreview.appendChild(pill);
                };

                if (isImage) reader.readAsDataURL(file); 
                else reader.readAsText(file);
            }
            fileUpload.value = ''; 
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                const original = btn.innerHTML;
                btn.innerHTML = `<i class="ph ph-check"></i> Copied!`;
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = original;
                    btn.classList.remove('bg-green-600');
                }, 2000);
            });
        }

        function downloadFile(id, extension) {
            const content = window.generatedFiles[id];
            if (!content) return;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `app_module_${Date.now()}.${extension}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        resetBtn.addEventListener('click', () => {
            conversationHistory = []; 
            attachedFilesContent = [];
            attachmentPreview.innerHTML = '';
            attachmentPreview.classList.add('hidden');
            chatContainer.innerHTML = ''; 
            chatContainer.appendChild(welcomeScreen); 
            welcomeScreen.style.display = 'flex';
        });

        function formatText(text) {
            if (!text) return '';
            let safeText = typeof text === 'string' ? text : JSON.stringify(text, null, 2);
            const codeBlocks = [];
            
            safeText = safeText.replace(/```([\w-]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                const id = 'file-' + Math.random().toString(36).substring(2, 11);
                window.generatedFiles[id] = code.trim(); 
                const ext = lang ? lang.split('-')[0] : 'txt';
                const displayLang = lang || 'code';
                
                const html = `
                <div class="bg-gray-800 rounded-lg my-3 overflow-hidden border border-gray-700 shadow-inner">
                    <div class="flex justify-between items-center bg-gray-900 px-3 py-2">
                        <span class="text-xs text-gray-400 font-mono uppercase">${displayLang}</span>
                        <div class="flex gap-2">
                            <button onclick="copyToClipboard(window.generatedFiles['${id}'], this)" class="flex items-center gap-1 bg-gray-700 hover:bg-gray-600 text-white text-xs px-3 py-1.5 rounded transition-colors active:scale-95">
                                <i class="ph ph-copy"></i> Copy
                            </button>
                            <button onclick="downloadFile('${id}', '${ext}')" class="flex items-center gap-1 bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-1.5 rounded transition-colors active:scale-95">
                                <i class="ph ph-download-simple"></i> Download
                            </button>
                        </div>
                    </div>
                    <div class="p-3 overflow-x-auto text-xs text-gray-300 font-mono leading-relaxed bg-[#1e1e1e]">
                        <pre><code>${escapeHtml(code.trim())}</code></pre>
                    </div>
                </div>`;
                codeBlocks.push(html);
                return `__CODE_BLOCK_${codeBlocks.length - 1}__`;
            });

            safeText = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            safeText = safeText.replace(/\n/g, '<br>');
            codeBlocks.forEach((html, index) => safeText = safeText.replace(`__CODE_BLOCK_${index}__`, html));
            return safeText;
        }

        function addMessage(text, isUser = false) {
            if (welcomeScreen) welcomeScreen.style.display = 'none';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            
            if (isUser) {
                bubble.className = 'bg-gray-800 text-white px-5 py-3 rounded-xl rounded-br-sm max-w-[85%] text-base shadow-sm';
                bubble.innerHTML = text; 
            } else {
                bubble.className = 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 px-4 py-3 rounded-xl rounded-bl-sm w-full text-sm shadow-sm leading-relaxed overflow-x-hidden';
                bubble.innerHTML = formatText(text);
            }

            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
        }

        function showLoading() {
            const loaderDiv = document.createElement('div');
            loaderDiv.id = 'loading-indicator';
            loaderDiv.className = 'flex w-full justify-start message-enter';
            loaderDiv.innerHTML = `
                <div class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 px-4 py-3 rounded-xl rounded-bl-sm shadow-sm flex items-center gap-2">
                    <div class="text-xs text-gray-500 dark:text-gray-400 font-mono">Gemini is thinking...</div>
                    <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                </div>
            `;
            chatContainer.appendChild(loaderDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ===================================================================
        // 3. STREAMING GEMINI API INTEGRATION
        // ===================================================================
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const apiKey = getApiKey();
            if (!apiKey) {
                settingsModal.classList.remove('hidden');
                return;
            }

            const rawUserInput = input.value.trim();
            if (!rawUserInput && attachedFilesContent.length === 0) return;

            let uiMessage = rawUserInput;
            if (attachedFilesContent.length > 0) {
                const fileTags = attachedFilesContent.map(f => {
                    if (f.isImage) return `<br><span class="text-xs text-blue-500">🖼️ ${f.name}</span>`;
                    return `<br><span class="text-xs text-blue-500">📄 ${f.name}</span>`;
                }).join('');
                uiMessage = rawUserInput ? `${rawUserInput}${fileTags}` : `Attached Files:${fileTags}`;
            }

            addMessage(uiMessage, true); 
            input.value = '';
            input.disabled = true;
            submitBtn.disabled = true;
            attachBtn.disabled = true;
            input.blur(); 

            const textFiles = attachedFilesContent.filter(f => !f.isImage);
            const imageFiles = attachedFilesContent.filter(f => f.isImage);

            let textToSendToAI = rawUserInput || "Please review the attached files.";
            
            if (textFiles.length > 0) {
                textToSendToAI += "\n\n--- ATTACHED CODE/TEXT ---\n";
                textFiles.forEach(file => {
                    textToSendToAI += `\nFile: ${file.name}\n\`\`\`\n${file.data}\n\`\`\`\n`;
                });
            }

            const currentMessageParts = [{ text: textToSendToAI }];
            
            imageFiles.forEach(file => {
                currentMessageParts.push({
                    inlineData: {
                        mimeType: file.mimeType,
                        data: file.data
                    }
                });
            });

            conversationHistory.push({ role: "user", parts: currentMessageParts });

            const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?key=${apiKey}`;

            const requestPayload = {
                contents: conversationHistory,
                generationConfig: {
                    temperature: 0.1,
                }
            };

            attachedFilesContent = [];
            attachmentPreview.innerHTML = '';
            attachmentPreview.classList.add('hidden');

            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex w-full message-enter justify-start';
            const bubble = document.createElement('div');
            bubble.className = 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 text-gray-800 dark:text-gray-200 px-4 py-3 rounded-xl rounded-bl-sm w-full text-sm shadow-sm leading-relaxed overflow-x-hidden min-h-[60px]';
            bubble.id = 'streaming-bubble';
            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

            let fullResponse = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestPayload)
                });

                if (!response.ok) {
                    throw new Error((await response.json()).error?.message || "API Request Failed");
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.trim() === '' || line.trim() === 'data: [DONE]') continue;
                        if (line.startsWith('data: ')) {
                            try {
                                const jsonStr = line.replace('data: ', '');
                                const data = JSON.parse(jsonStr);
                                const delta = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                                if (delta) {
                                    fullResponse += delta;
                                    bubble.innerHTML = formatText(fullResponse);
                                    chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
                                }
                            } catch (e) {}
                        }
                    }
                }

                conversationHistory.push({ role: "model", parts: [{ text: fullResponse }] });

                if (imageFiles.length > 0) {
                    const lastUserMsg = conversationHistory[conversationHistory.length - 2];
                    if (lastUserMsg) lastUserMsg.parts = lastUserMsg.parts.filter(p => !p.inlineData);
                }

            } catch (error) {
                console.error("Error:", error);
                let errorMsg = error.message;
                if (errorMsg.includes("API key not valid")) {
                    errorMsg = "Invalid API Key. Please update it.";
                    localStorage.removeItem('gemini_api_key');
                }
                bubble.innerHTML = `⚠️ <strong>System Error:</strong><br>${errorMsg}`;
            } finally {
                input.disabled = false;
                submitBtn.disabled = false;
                attachBtn.disabled = false;
            }
        });

        initTheme();
    </script>
</body>
</html>
