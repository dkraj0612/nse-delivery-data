<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Institutional Forensic Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        body { background-color: #09090b; color: #e4e4e7; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Toast Notifications */
        #toast-container { z-index: 9999; pointer-events: none; }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .toast-exit { animation: fadeOut 0.3s forwards; }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }

        /* Markdown Styling */
        .prose p { margin-bottom: 1em; line-height: 1.6; }
        .prose h1, .prose h2, .prose h3 { color: #f4f4f5; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; font-family: monospace; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1em; }
        .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1em; }
        .prose code:not(pre code) { background-color: #27272a; padding: 0.2em 0.4em; border-radius: 0.25rem; font-family: monospace; color: #a78bfa; }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col font-sans overflow-hidden bg-[#09090b]">

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed top-4 right-4 flex flex-col gap-2"></div>

    <!-- Auth Screen -->
    <div id="auth-screen" class="fixed inset-0 z-[100] bg-zinc-950 flex items-center justify-center p-4 transition-opacity duration-300">
        <form id="auth-form" class="w-full max-w-sm bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-900/50">
                    <i class="ph ph-shield-check text-white text-3xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-zinc-100 tracking-tight">System Lock</h2>
                <p class="text-xs text-zinc-400 mt-2 font-mono uppercase tracking-widest">Local Operator Auth</p>
            </div>
            <input type="text" id="auth-username" class="w-full bg-zinc-950 border border-zinc-800 rounded-xl p-4 mb-4 text-white font-mono focus:border-indigo-500 focus:outline-none transition-colors" placeholder="OPERATOR ID" required autocomplete="off">
            <button type="submit" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-xl font-bold text-white transition-colors active:scale-95 shadow-lg shadow-indigo-900/30">AUTHENTICATE</button>
        </form>
    </div>

    <!-- Main App Layout -->
    <div id="main-app" class="hidden flex-1 flex flex-col w-full h-full overflow-hidden relative">
        
        <!-- Header -->
        <header class="shrink-0 border-b border-zinc-800 p-3 sm:p-4 flex justify-between items-center bg-zinc-950 z-20">
            <div class="flex items-center gap-3">
                <button id="menu-btn" class="relative text-zinc-400 hover:text-white transition-colors p-1 focus:outline-none">
                    <i class="ph ph-list text-2xl"></i>
                    <span id="menu-warning-dot" class="hidden absolute top-1 right-1 w-2 h-2 bg-amber-500 rounded-full animate-pulse"></span>
                </button>
                <div>
                    <h1 class="font-bold tracking-tight flex items-center gap-2 text-sm sm:text-base"><i class="ph ph-radar text-indigo-500"></i> FORENSIC STUDIO</h1>
                    <p class="text-[10px] text-zinc-500 font-mono uppercase tracking-widest mt-0.5">LocalForage</p>
                </div>
            </div>
            <div class="flex gap-2 sm:gap-4 items-center">
                <button id="settings-btn" class="text-zinc-400 hover:text-zinc-100 transition-colors focus:outline-none p-1"><i class="ph ph-sliders-horizontal text-xl"></i></button>
                <button id="logout-btn" class="text-zinc-500 hover:text-rose-400 text-xs font-bold tracking-widest transition-colors focus:outline-none flex items-center gap-1"><i class="ph ph-lock-key"></i> <span class="hidden sm:inline">LOCK</span></button>
            </div>
        </header>

        <!-- Watchlist Bar -->
        <div class="shrink-0 bg-zinc-900/30 border-b border-zinc-800/80 z-10">
            <div class="max-w-4xl mx-auto w-full px-3 py-2 flex gap-2 overflow-x-auto no-scrollbar items-center">
                <span class="text-[10px] text-zinc-500 font-semibold uppercase tracking-widest mr-1 shrink-0 flex items-center gap-1"><i class="ph ph-list-magnifying-glass text-sm"></i> Watchlist</span>
                
                <div id="watchlist-chips" class="flex gap-2 items-center shrink-0"></div>
                
                <button id="open-add-stock-btn" class="shrink-0 flex items-center gap-1.5 bg-zinc-950 hover:bg-zinc-800 text-zinc-300 border border-zinc-700 px-3 py-1.5 rounded-full text-xs transition-colors focus:outline-none shadow-sm">
                    <i class="ph ph-plus"></i> Target
                </button>
                <div class="flex-1 min-w-[10px]"></div>
                <button id="run-radar-btn" class="shrink-0 flex items-center gap-1.5 bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-3 py-1.5 rounded-full text-xs transition-colors font-bold font-mono tracking-widest shadow-sm focus:outline-none">
                    <i class="ph ph-broadcast animate-pulse"></i> Radar
                </button>
            </div>
        </div>

        <!-- Chat Area (Flex-1 ensures it fills available space) -->
        <div class="flex-1 overflow-y-auto relative w-full" id="scroll-container">
            <main id="chat-container" class="max-w-4xl mx-auto w-full px-4 py-6 space-y-6 flex flex-col justify-end min-h-full">
                <!-- Welcome Screen -->
                <div class="flex flex-col items-center justify-center flex-1 text-center space-y-4 opacity-50 py-10" id="welcome-screen">
                    <i class="ph ph-terminal-window text-6xl text-zinc-600 mb-2"></i>
                    <h2 class="text-sm font-mono tracking-widest text-zinc-400 uppercase">System Ready</h2>
                    <p class="text-xs text-zinc-500 mt-2 max-w-[250px] mx-auto leading-relaxed">Select a mode below to begin structured analysis, or hit RADAR to scan the watchlist.</p>
                </div>
            </main>
        </div>

        <!-- Footer / Input Area -->
        <footer class="shrink-0 bg-zinc-950 border-t border-zinc-800 p-3 pb-[max(0.75rem,env(safe-area-inset-bottom))] z-20">
            <form id="search-form" class="max-w-4xl mx-auto flex gap-2 w-full">
                <!-- Mode Toggle -->
                <button type="button" id="mode-toggle-btn" class="shrink-0 h-12 px-3 sm:px-4 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center gap-2 text-indigo-400 transition-all font-mono text-xs focus:outline-none shadow-sm">
                    <i class="ph ph-radar text-lg" id="mode-icon"></i>
                    <span class="hidden sm:block font-bold uppercase tracking-widest" id="mode-text">Forensic</span>
                </button>
                
                <!-- Input Box -->
                <input type="text" id="search-input" class="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 transition-colors shadow-inner text-sm" placeholder="Analyze asset (e.g. RELIANCE)..." autocomplete="off">
                
                <!-- Submit Button -->
                <button type="submit" id="run-btn" class="shrink-0 h-12 bg-indigo-600 hover:bg-indigo-500 px-4 sm:px-6 rounded-xl font-bold text-white transition-colors disabled:opacity-50 flex items-center justify-center focus:outline-none shadow-md">
                    <i class="ph ph-paper-plane-right sm:hidden text-lg"></i>
                    <span class="hidden sm:inline">RUN</span>
                </button>
            </form>
        </footer>

        <!-- Sidebar Drawer -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden backdrop-blur-sm transition-opacity opacity-0 duration-300"></div>
        <div id="sidebar" class="fixed inset-y-0 left-0 w-72 max-w-[85vw] bg-zinc-950 border-r border-zinc-800 z-40 transform -translate-x-full transition-transform duration-300 flex flex-col shadow-2xl">
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center bg-zinc-900/50">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-indigo-900 text-indigo-300 flex items-center justify-center font-bold text-sm" id="sidebar-avatar">O</div>
                    <h2 class="text-xs font-mono uppercase tracking-widest text-zinc-300 font-bold" id="sidebar-username">Operator</h2>
                </div>
                <button id="close-sidebar-btn" class="text-zinc-500 hover:text-zinc-300 p-1 focus:outline-none"><i class="ph ph-x text-xl"></i></button>
            </div>
            <div class="p-4 border-b border-zinc-800 space-y-3">
                <button id="new-chat-btn" class="w-full flex items-center justify-center gap-2 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 px-3 py-3 rounded-lg transition-colors text-sm font-semibold focus:outline-none shadow-sm">
                    <i class="ph ph-plus font-bold"></i> New Analysis
                </button>
                <div class="flex gap-2">
                    <button id="git-push-btn" class="flex-1 flex items-center justify-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 text-emerald-400 border border-emerald-900/50 px-2 py-2.5 rounded-lg transition-all text-xs font-mono font-bold focus:outline-none">
                        <i class="ph ph-upload-simple text-sm"></i> Push
                    </button>
                    <button id="git-pull-btn" class="flex-1 flex items-center justify-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 text-blue-400 border border-blue-900/50 px-2 py-2.5 rounded-lg transition-all text-xs font-mono font-bold focus:outline-none">
                        <i class="ph ph-download-simple text-sm"></i> Pull
                    </button>
                </div>
            </div>
            <div class="px-4 py-2 text-[10px] font-mono uppercase tracking-widest bg-zinc-950/50 border-b border-zinc-800/50 flex justify-between items-center">
                <span class="text-zinc-600">Local Sessions</span>
                <span id="sync-badge" class="text-emerald-500 flex items-center gap-1"><i class="ph ph-check-circle"></i> Synced</span>
            </div>
            <div id="session-list" class="flex-1 overflow-y-auto p-2 space-y-1 no-scrollbar"></div>
        </div>

        <!-- Settings Modal -->
        <div id="settings-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-sm max-h-[90vh] overflow-y-auto no-scrollbar shadow-2xl">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-sm font-mono uppercase tracking-widest text-zinc-300 flex items-center gap-2"><i class="ph ph-sliders-horizontal text-indigo-500"></i> Settings & Vault</h3>
                    <button id="close-settings-btn" class="text-zinc-500 hover:text-white focus:outline-none"><i class="ph ph-x text-lg"></i></button>
                </div>
                <div class="space-y-5">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-mono uppercase tracking-widest text-indigo-400">Gemini API Key</label>
                        <input type="password" id="api-key-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-zinc-100 font-mono focus:border-indigo-500 focus:outline-none shadow-inner" placeholder="AIzaSy...">
                    </div>
                    <div class="pt-4 border-t border-zinc-800 space-y-4">
                        <label class="block text-[10px] font-mono uppercase tracking-widest text-emerald-400">GitHub Vault Config</label>
                        <input type="password" id="git-token-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-zinc-100 font-mono focus:border-emerald-500 focus:outline-none shadow-inner" placeholder="Token (ghp_...)">
                        <div class="grid grid-cols-2 gap-3">
                            <input type="text" id="git-user-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-zinc-100 font-mono focus:border-emerald-500 focus:outline-none shadow-inner" placeholder="Username">
                            <input type="text" id="git-repo-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-zinc-100 font-mono focus:border-emerald-500 focus:outline-none shadow-inner" placeholder="Repo Name">
                        </div>
                    </div>
                    <button id="save-settings-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-sm transition-colors mt-2 shadow-lg focus:outline-none">Save Configurations</button>
                </div>
            </div>
        </div>

        <!-- Add Stock Modal -->
        <div id="add-stock-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                <div class="flex justify-between items-center mb-5">
                    <h3 class="text-sm font-mono uppercase tracking-widest text-zinc-300">Add Target</h3>
                    <button id="close-add-stock-btn" class="text-zinc-500 hover:text-white focus:outline-none"><i class="ph ph-x text-lg"></i></button>
                </div>
                <input type="text" id="new-stock-input" class="w-full bg-zinc-950 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-zinc-100 font-mono focus:border-indigo-500 focus:outline-none mb-5 shadow-inner" placeholder="TICKER (e.g. AAPL)">
                <button id="save-stock-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3.5 rounded-xl text-sm transition-colors shadow-lg focus:outline-none">Append to Watchlist</button>
            </div>
        </div>

    </div>

    <script>
        // ==========================================
        // 1. STATE & ARCHITECTURE
        // ==========================================
        localforage.config({ name: 'ForensicStudio', storeName: 'git_vault_data' });

        let isForensicMode = true;
        let currentSessionId = Date.now().toString();
        let savedSessions = {};
        let localStocks = ["RELIANCE", "TCS", "INFY"];
        let operatorId = localStorage.getItem('fs_operator') || "";
        let hasUnsyncedChanges = false;
        
        // Context-Isolated Prompts
        const MASTER_PROMPT = `You are an elite Institutional Forensic Analyst. Output STRICTLY VALID JSON. NO markdown blocks outside JSON. Schema: { "metadata": { "company_name": "", "ticker": "", "classification": "", "analysis_date": "" }, "kpis": { "market_cap": "", "pe_ratio": "", "roe": "", "debt_to_equity": "", "final_verdict": "STRONG BUY / HOLD / AVOID" }, "governance": { "promoter_integrity": "", "red_flags": "" }, "financial_forensics": { "revenue_quality": "", "hidden_debt": "" }, "catalysts_and_sentiment": { "upcoming_triggers": "" } }`;
        const RADAR_PROMPT = `Use Google Search to scan the latest institutional news, bulk deals, or earnings (last 24-48 hrs). OUTPUT STRICTLY VALID JSON. Schema: { "radar_date": "Today's Date", "market_sentiment_summary": "1-2 sentence overview", "stock_updates": [ { "ticker": "STOCK_NAME", "news_summary": "2-3 crisp bullet points", "sentiment": "Positive / Negative / Neutral", "severity": "High / Medium / Low" } ] }`;

        // ==========================================
        // 2. UTILITIES & TOASTS
        // ==========================================
        function escapeHTML(str) { return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag])) : ""; }
        function utoa(str) { return btoa(unescape(encodeURIComponent(str))); }
        function atou(str) { return decodeURIComponent(escape(atob(str))); }
        
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'error' ? 'bg-rose-950 border-rose-900 text-rose-400' : 'bg-zinc-900 border-zinc-800 text-zinc-300';
            const icon = type === 'error' ? '<i class="ph ph-warning-circle text-lg"></i>' : '<i class="ph ph-info text-lg"></i>';
            toast.className = `flex items-center gap-3 px-4 py-3 rounded-xl border shadow-lg text-sm font-mono toast-enter ${colors}`;
            toast.innerHTML = `${icon} <span>${escapeHTML(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.replace('toast-enter', 'toast-exit'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function scrollToBottom() {
            const container = document.getElementById('scroll-container');
            container.scrollTop = container.scrollHeight;
        }

        // ==========================================
        // 3. INITIALIZATION & AUTH
        // ==========================================
        async function initApp() {
            try {
                const storedSessions = await localforage.getItem('sessions');
                if (storedSessions) savedSessions = storedSessions;
                const storedStocks = await localforage.getItem('watchlist');
                if (storedStocks) localStocks = storedStocks;
            } catch (e) { console.error("DB Load Error", e); }

            if (operatorId) finalizeLogin();
            else document.getElementById('auth-screen').classList.remove('hidden');
        }

        document.getElementById('auth-form').onsubmit = (e) => {
            e.preventDefault();
            operatorId = document.getElementById('auth-username').value.trim() || "OPERATOR";
            localStorage.setItem('fs_operator', operatorId);
            finalizeLogin();
        };

        function finalizeLogin() {
            document.getElementById('auth-screen').classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                document.getElementById('auth-screen').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                document.getElementById('sidebar-username').innerText = operatorId;
                document.getElementById('sidebar-avatar').innerText = operatorId.charAt(0).toUpperCase();
                renderWatchlist();
                renderSidebar();
                if (Object.keys(savedSessions).length > 0) {
                    loadSession(Object.keys(savedSessions).sort((a,b) => savedSessions[b].updatedAt - savedSessions[a].updatedAt)[0]);
                }
            }, 300);
        }

        document.getElementById('logout-btn').onclick = () => { localStorage.removeItem('fs_operator'); location.reload(); };

        // ==========================================
        // 4. GIT VAULT & ANTI-AMNESIA
        // ==========================================
        function triggerDirtyState() {
            hasUnsyncedChanges = true;
            document.getElementById('menu-warning-dot').classList.remove('hidden');
            const pushBtn = document.getElementById('git-push-btn');
            pushBtn.className = "flex-1 flex items-center justify-center gap-1.5 bg-amber-500/20 text-amber-400 border border-amber-500/50 px-2 py-2.5 rounded-lg transition-all text-xs font-mono font-bold animate-pulse shadow-[0_0_10px_rgba(245,158,11,0.2)]";
            const badge = document.getElementById('sync-badge');
            badge.className = "text-amber-500 flex items-center gap-1 font-bold animate-pulse";
            badge.innerHTML = '<i class="ph ph-warning"></i> Unsynced';
        }

        function clearDirtyState() {
            hasUnsyncedChanges = false;
            document.getElementById('menu-warning-dot').classList.add('hidden');
            const pushBtn = document.getElementById('git-push-btn');
            pushBtn.className = "flex-1 flex items-center justify-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 text-emerald-400 border border-emerald-900/50 px-2 py-2.5 rounded-lg transition-all text-xs font-mono font-bold";
            const badge = document.getElementById('sync-badge');
            badge.className = "text-emerald-500 flex items-center gap-1";
            badge.innerHTML = '<i class="ph ph-check-circle"></i> Synced';
        }

        window.addEventListener('beforeunload', (e) => {
            if (hasUnsyncedChanges) { e.preventDefault(); e.returnValue = 'You have unsynced changes. Push to Git before leaving.'; }
        });

        async function gitSync(action) {
            const token = localStorage.getItem('fs_git_token');
            const owner = localStorage.getItem('fs_git_user');
            const repo = localStorage.getItem('fs_git_repo');
            
            if (!token || !owner || !repo) {
                showToast("Missing GitHub Vault config.", "error");
                document.getElementById('settings-modal').classList.remove('hidden');
                return;
            }

            const path = "vault_backup.json";
            const apiUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
            const btn = action === 'push' ? document.getElementById('git-push-btn') : document.getElementById('git-pull-btn');
            
            btn.className = "flex-1 flex items-center justify-center gap-1.5 bg-zinc-800 text-zinc-400 border border-zinc-700 px-2 py-2.5 rounded-lg text-xs font-mono font-bold";
            btn.innerHTML = `<i class="ph ph-circle-notch animate-spin"></i> Processing...`;

            try {
                let sha = null; let existingContent = null;
                const getRes = await fetch(apiUrl, { headers: { 'Authorization': `Bearer ${token}` } });
                if (getRes.ok) { const data = await getRes.json(); sha = data.sha; existingContent = data.content; }

                if (action === 'push') {
                    const payload = { sessions: savedSessions, stocks: localStocks, timestamp: Date.now() };
                    const b64Content = utoa(JSON.stringify(payload));
                    const body = { message: `Vault Sync: ${new Date().toISOString()}`, content: b64Content };
                    if (sha) body.sha = sha;

                    const putRes = await fetch(apiUrl, { method: 'PUT', headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                    if (!putRes.ok) throw new Error("Push Failed.");
                    
                    clearDirtyState();
                    showToast("Vault Push Successful!");
                    btn.innerHTML = `<i class="ph ph-check text-emerald-400"></i> Success`;
                } else if (action === 'pull') {
                    if (!sha) throw new Error("No backup found on GitHub.");
                    const payload = JSON.parse(atou(existingContent));
                    
                    if (payload.sessions) savedSessions = payload.sessions;
                    if (payload.stocks) localStocks = payload.stocks;
                    
                    await localforage.setItem('sessions', savedSessions);
                    await localforage.setItem('watchlist', localStocks);
                    
                    renderSidebar(); renderWatchlist();
                    if(Object.keys(savedSessions).length > 0) loadSession(Object.keys(savedSessions).sort((a,b)=>savedSessions[b].updatedAt-savedSessions[a].updatedAt)[0]);
                    
                    clearDirtyState();
                    showToast("Vault Restore Successful!");
                    btn.innerHTML = `<i class="ph ph-check text-blue-400"></i> Restored`;
                }
            } catch (err) {
                console.error(err); showToast(err.message, "error");
                btn.innerHTML = `<i class="ph ph-warning-circle text-rose-500"></i> Error`;
            } finally {
                setTimeout(() => { 
                    if (action === 'push') { if (hasUnsyncedChanges) triggerDirtyState(); else clearDirtyState(); btn.innerHTML = `<i class="ph ph-upload-simple"></i> Push`; } 
                    else { btn.className = "flex-1 flex items-center justify-center gap-1.5 bg-zinc-900 hover:bg-zinc-800 text-blue-400 border border-blue-900/50 px-2 py-2.5 rounded-lg transition-all text-xs font-mono font-bold"; btn.innerHTML = `<i class="ph ph-download-simple"></i> Pull`; }
                }, 3000);
            }
        }

        document.getElementById('git-push-btn').onclick = () => gitSync('push');
        document.getElementById('git-pull-btn').onclick = () => gitSync('pull');

        // ==========================================
        // 5. API EXECUTION (TOKEN BLOAT FIX)
        // ==========================================
        async function fetchGeminiWithBackoff(payload) {
            const apiKeyConfig = localStorage.getItem('fs_api_key');
            if (!apiKeyConfig) throw new Error("API_KEY_MISSING");

            const maxRetries = 5; const delays = [1000, 2000, 4000, 8000, 16000];
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKeyConfig}`;

            for (let i = 0; i <= maxRetries; i++) {
                try {
                    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || "API Connection Failed");
                    return data;
                } catch (error) { 
                    if (i === maxRetries) throw error; 
                    await new Promise(r => setTimeout(r, delays[i])); 
                }
            }
        }

        document.getElementById('search-form').onsubmit = async (e) => {
            e.preventDefault();
            const q = document.getElementById('search-input').value.trim();
            if (!q) return;

            if (!localStorage.getItem('fs_api_key')) { 
                showToast("Missing API Key.", "error");
                document.getElementById('settings-modal').classList.remove('hidden'); 
                return; 
            }

            addMessageToDOM("user", q);
            document.getElementById('search-input').value = "";
            document.getElementById('run-btn').disabled = true;

            let contentsArray = [];
            let sysInstruction = "";

            if (isForensicMode) {
                contentsArray = [{ role: "user", parts: [{ text: `Target: ${q}` }] }];
                sysInstruction = MASTER_PROMPT;
            } else {
                const historyArr = savedSessions[currentSessionId]?.history || [];
                const rollingHistory = historyArr.slice(-4).map(msg => ({
                    role: msg.role === 'ai' ? 'model' : 'user',
                    parts: [{ text: msg.text }]
                }));
                rollingHistory.push({ role: "user", parts: [{ text: q }] });
                contentsArray = rollingHistory;
                sysInstruction = "You are a general financial assistant. Use markdown formatting.";
            }

            saveSessionLocal("user", q);
            await triggerAI(contentsArray, sysInstruction);
        };

        document.getElementById('run-radar-btn').onclick = async () => {
            if (localStocks.length === 0) return showToast("Watchlist is empty.", "error");
            if (!localStorage.getItem('fs_api_key')) {
                showToast("Missing API Key.", "error");
                return document.getElementById('settings-modal').classList.remove('hidden');
            }
            if (!isForensicMode) document.getElementById('mode-toggle-btn').click();
            
            const promptText = `Watchlist: ${localStocks.join(', ')}. Date: ${new Date().toISOString().split('T')[0]}`;
            const uiText = `RUN RADAR: Scrape Live News for ${localStocks.length} Stocks`;
            
            addMessageToDOM("user", `<span class="text-indigo-400 font-bold flex items-center gap-2"><i class="ph ph-broadcast animate-pulse"></i> ${escapeHTML(uiText)}</span>`, true);
            saveSessionLocal("user", uiText);

            const contentsArray = [{ role: "user", parts: [{ text: promptText }] }];
            await triggerAI(contentsArray, RADAR_PROMPT);
        };

        async function triggerAI(contentsArray, sysInstruction) {
            const payload = {
                contents: contentsArray,
                systemInstruction: { parts: [{ text: sysInstruction }] },
                generationConfig: { temperature: 0.1 },
                tools: [{ google_search: {} }] 
            };

            const loaderId = showLoadingUI();
            try {
                const data = await fetchGeminiWithBackoff(payload);
                document.getElementById(loaderId)?.remove();
                
                const responseText = data.candidates[0].content.parts[0].text;
                addMessageToDOM("ai", responseText);
                saveSessionLocal("ai", responseText);
            } catch (err) {
                document.getElementById(loaderId)?.remove();
                if (err.message === "API_KEY_MISSING") {
                    showToast("API Key is missing.", "error");
                    document.getElementById('settings-modal').classList.remove('hidden');
                } else {
                    showToast("Analysis Failed.", "error");
                    addMessageToDOM("ai", `**System Error:** ${escapeHTML(err.message)}`);
                }
            } finally {
                document.getElementById('run-btn').disabled = false;
            }
        }

        // ==========================================
        // 6. DB MGMT & CHAT RENDERERS
        // ==========================================
        async function saveSessionLocal(role, text) {
            if (!savedSessions[currentSessionId]) {
                let title = text.replace(/<[^>]*>?/gm, '').substring(0, 25) + "..."; 
                if (role !== 'user') title = "New Analysis";
                savedSessions[currentSessionId] = { id: currentSessionId, title: title, history: [], updatedAt: Date.now() };
            }
            savedSessions[currentSessionId].history.push({ role, text });
            savedSessions[currentSessionId].updatedAt = Date.now();
            await localforage.setItem('sessions', savedSessions);
            triggerDirtyState();
            renderSidebar();
        }

        function clearChatBubbles() {
            const container = document.getElementById('chat-container');
            Array.from(container.children).forEach(child => {
                if (child.id !== 'welcome-screen') child.remove();
            });
        }

        function loadSession(id) {
            if (!savedSessions[id]) return;
            currentSessionId = id;
            clearChatBubbles();
            document.getElementById('welcome-screen').style.display = 'none';
            
            savedSessions[id].history.forEach(msg => {
                const isHtmlStr = msg.text.includes('<span') || msg.text.includes('<i class');
                if (msg.role === 'user' && isHtmlStr) addMessageToDOM('user', msg.text, true); 
                else addMessageToDOM(msg.role, msg.text);
            });
            closeSidebar();
            scrollToBottom();
        }

        document.getElementById('new-chat-btn').onclick = () => {
            currentSessionId = Date.now().toString();
            clearChatBubbles();
            document.getElementById('welcome-screen').style.display = 'flex';
            closeSidebar();
            renderSidebar();
        };

        // ==========================================
        // 7. UI CONTROLS & MODALS
        // ==========================================
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');
        document.getElementById('menu-btn').onclick = () => { sidebar.classList.remove('-translate-x-full'); sidebarOverlay.classList.remove('hidden'); setTimeout(() => sidebarOverlay.classList.remove('opacity-0'), 10); };
        const closeSidebar = () => { sidebar.classList.add('-translate-x-full'); sidebarOverlay.classList.add('opacity-0'); setTimeout(() => sidebarOverlay.classList.add('hidden'), 300); };
        document.getElementById('close-sidebar-btn').onclick = closeSidebar; sidebarOverlay.onclick = closeSidebar;

        const modeToggleBtn = document.getElementById('mode-toggle-btn');
        const searchInput = document.getElementById('search-input');
        modeToggleBtn.onclick = () => {
            isForensicMode = !isForensicMode;
            if (isForensicMode) {
                modeToggleBtn.className = "shrink-0 h-12 px-3 sm:px-4 rounded-xl bg-indigo-500/10 border border-indigo-500/30 flex items-center justify-center gap-2 text-indigo-400 transition-all font-mono text-xs focus:outline-none shadow-sm";
                document.getElementById('mode-icon').className = "ph ph-radar text-lg"; document.getElementById('mode-text').innerText = "Forensic"; searchInput.placeholder = "Analyze asset (e.g. RELIANCE)...";
            } else {
                modeToggleBtn.className = "shrink-0 h-12 px-3 sm:px-4 rounded-xl bg-zinc-800 border border-zinc-700 flex items-center justify-center gap-2 text-zinc-400 transition-all font-mono text-xs focus:outline-none shadow-sm";
                document.getElementById('mode-icon').className = "ph ph-chat-circle-dots text-lg"; document.getElementById('mode-text').innerText = "General"; searchInput.placeholder = "Ask anything...";
            }
        };

        document.getElementById('settings-btn').onclick = () => {
            document.getElementById('api-key-input').value = localStorage.getItem('fs_api_key') || "";
            document.getElementById('git-token-input').value = localStorage.getItem('fs_git_token') || "";
            document.getElementById('git-user-input').value = localStorage.getItem('fs_git_user') || "";
            document.getElementById('git-repo-input').value = localStorage.getItem('fs_git_repo') || "";
            document.getElementById('settings-modal').classList.remove('hidden');
        };
        document.getElementById('close-settings-btn').onclick = () => document.getElementById('settings-modal').classList.add('hidden');
        document.getElementById('save-settings-btn').onclick = () => {
            localStorage.setItem('fs_api_key', document.getElementById('api-key-input').value.trim());
            localStorage.setItem('fs_git_token', document.getElementById('git-token-input').value.trim());
            localStorage.setItem('fs_git_user', document.getElementById('git-user-input').value.trim());
            localStorage.setItem('fs_git_repo', document.getElementById('git-repo-input').value.trim());
            document.getElementById('settings-modal').classList.add('hidden');
            showToast("Settings Saved.");
        };

        function renderSidebar() {
            const list = document.getElementById('session-list');
            list.innerHTML = '';
            const sorted = Object.values(savedSessions).sort((a,b) => b.updatedAt - a.updatedAt);
            sorted.forEach(s => {
                const div = document.createElement('div');
                div.className = `flex justify-between items-center group px-3 py-3 rounded-lg text-sm font-mono cursor-pointer transition-colors ${s.id === currentSessionId ? 'bg-zinc-800 text-zinc-100' : 'text-zinc-400 hover:bg-zinc-900/80'}`;
                div.innerHTML = `<span class="truncate flex-1">${escapeHTML(s.title)}</span>`;
                div.onclick = () => loadSession(s.id);
                
                const del = document.createElement('button');
                del.className = "text-zinc-600 hover:text-rose-500 p-2 focus:outline-none transition-colors sm:opacity-0 sm:group-hover:opacity-100";
                del.innerHTML = '<i class="ph ph-trash"></i>';
                del.onclick = async (e) => {
                    e.stopPropagation(); 
                    delete savedSessions[s.id];
                    await localforage.setItem('sessions', savedSessions);
                    triggerDirtyState();
                    if (currentSessionId === s.id) document.getElementById('new-chat-btn').click();
                    else renderSidebar();
                };
                div.appendChild(del); list.appendChild(div);
            });
        }

        // TOUCH FRIENDLY WATCHLIST FIX
        function renderWatchlist() {
            const container = document.getElementById('watchlist-chips');
            container.innerHTML = '';
            localStocks.forEach(stock => {
                const wrapper = document.createElement('div');
                wrapper.className = "flex items-center shrink-0 bg-zinc-800 border border-zinc-700 rounded-full overflow-hidden shadow-sm";
                
                // Button 1: The Search Button (Main Hit Area)
                const searchBtn = document.createElement('button');
                searchBtn.className = "px-3 py-1.5 text-[11px] font-mono text-zinc-300 hover:bg-zinc-700 hover:text-white transition-colors focus:outline-none";
                searchBtn.textContent = stock;
                searchBtn.onclick = () => {
                    if (!isForensicMode) modeToggleBtn.click();
                    searchInput.value = stock;
                    document.getElementById('search-form').dispatchEvent(new Event('submit'));
                };

                // Button 2: The Delete Button (Tiny, separate hit area)
                const delBtn = document.createElement('button');
                delBtn.className = "px-2 py-1.5 bg-zinc-800 border-l border-zinc-700 hover:bg-rose-900 text-zinc-500 hover:text-rose-400 transition-colors focus:outline-none flex items-center justify-center";
                delBtn.innerHTML = '<i class="ph ph-x text-[10px]"></i>';
                delBtn.onclick = async () => {
                    localStocks = localStocks.filter(s => s !== stock); 
                    await localforage.setItem('watchlist', localStocks);
                    triggerDirtyState(); renderWatchlist(); 
                };

                wrapper.appendChild(searchBtn);
                wrapper.appendChild(delBtn);
                container.appendChild(wrapper);
            });
        }

        document.getElementById('open-add-stock-btn').onclick = () => document.getElementById('add-stock-modal').classList.remove('hidden');
        document.getElementById('close-add-stock-btn').onclick = () => document.getElementById('add-stock-modal').classList.add('hidden');
        document.getElementById('save-stock-btn').onclick = async () => {
            const val = document.getElementById('new-stock-input').value.trim().toUpperCase();
            if (val && !localStocks.includes(val)) { 
                localStocks.push(val); 
                await localforage.setItem('watchlist', localStocks);
                triggerDirtyState(); renderWatchlist(); 
                showToast("Added to Watchlist");
            }
            document.getElementById('new-stock-input').value = '';
            document.getElementById('add-stock-modal').classList.add('hidden');
        };

        function showLoadingUI() {
            const id = 'loader-' + Date.now();
            const container = document.getElementById('chat-container');
            const div = document.createElement('div'); div.id = id; div.className = "flex justify-center my-4";
            div.innerHTML = `<div class="bg-zinc-900 border border-zinc-800 px-5 py-2.5 rounded-full flex items-center gap-3 shadow-lg"><i class="ph ph-circle-notch animate-spin text-indigo-500"></i><span class="text-xs text-zinc-400 font-mono tracking-widest uppercase">Executing Forensic Scan...</span></div>`;
            container.appendChild(div); scrollToBottom(); return id;
        }

        function addMessageToDOM(role, text, isRawHtml = false) {
            document.getElementById('welcome-screen').style.display = 'none';
            const container = document.getElementById('chat-container');
            const div = document.createElement('div');
            div.className = `p-4 sm:p-5 rounded-2xl w-full mx-auto ${role === 'user' ? 'bg-zinc-800/80 ml-auto max-w-[90%] sm:max-w-md rounded-tr-sm shadow-sm' : 'bg-zinc-950 border border-zinc-800/80 shadow-lg'}`;
            if (role === 'user') { div.innerHTML = `<div class="text-sm font-mono text-zinc-200">${isRawHtml ? text : escapeHTML(text)}</div>`; } 
            else { div.innerHTML = formatAIText(text); }
            container.appendChild(div); scrollToBottom();
        }

        // ==========================================
        // 8. FORENSIC JSON BUILDERS
        // ==========================================
        function formatAIText(text) {
            if (!text) return '';
            try {
                let cleaned = text.replace(/```json\n?/g, '').replace(/```\n?/g, '').trim();
                const start = cleaned.indexOf('{'); const end = cleaned.lastIndexOf('}');
                if (start !== -1 && end !== -1 && end > start) {
                    const parsed = JSON.parse(cleaned.substring(start, end + 1));
                    if (parsed.stock_updates) return buildRadarHTML(parsed);
                    if (parsed.kpis) return buildForensicHTML(parsed);
                }
            } catch (e) {}
            return `<div class="prose prose-invert max-w-none text-sm leading-relaxed">${marked.parse(text)}</div>`;
        }

        function buildForensicHTML(obj) {
            let html = '<div class="flex flex-col gap-4 font-sans">';
            if (obj.metadata) {
                let verdictStyle = "border-zinc-700 text-zinc-300 bg-zinc-800";
                if (obj.kpis?.final_verdict?.includes('BUY')) verdictStyle = "border-emerald-500/50 text-emerald-400 bg-emerald-950/40";
                if (obj.kpis?.final_verdict?.includes('AVOID')) verdictStyle = "border-rose-500/50 text-rose-400 bg-rose-950/40";
                html += `<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 sm:p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3"><div class="flex-1"><h2 class="text-lg sm:text-xl font-bold text-zinc-100">${escapeHTML(obj.metadata.company_name)}</h2><p class="text-xs font-mono text-indigo-400 mt-1">${escapeHTML(obj.metadata.ticker)} • ${escapeHTML(obj.metadata.classification)}</p></div><div class="px-4 py-2 border rounded-lg text-xs font-bold uppercase tracking-widest w-full sm:w-auto text-center ${verdictStyle}">${escapeHTML(obj.kpis?.final_verdict || 'N/A')}</div></div>`;
            }
            if (obj.kpis) {
                html += `<div class="grid grid-cols-2 md:grid-cols-4 gap-3">`;
                for (const [k, v] of Object.entries(obj.kpis)) { if (k === 'final_verdict') continue; html += `<div class="bg-zinc-900/50 border border-zinc-800 p-3 rounded-lg shadow-sm"><div class="text-[9px] text-zinc-500 uppercase tracking-widest mb-1 font-bold">${escapeHTML(k.replace(/_/g, ' '))}</div><div class="text-sm font-mono text-zinc-200 truncate">${escapeHTML(String(v))}</div></div>`; }
                html += `</div>`;
            }
            ['governance', 'financial_forensics', 'catalysts_and_sentiment'].forEach(sec => {
                if (obj[sec]) {
                    html += `<div class="border border-zinc-800 rounded-lg overflow-hidden shadow-sm"><div class="bg-zinc-900 px-4 py-2.5 border-b border-zinc-800"><h3 class="text-xs font-bold text-zinc-300 uppercase tracking-wider">${escapeHTML(sec.replace(/_/g, ' '))}</h3></div><div class="p-4 space-y-4 bg-zinc-950/50">`;
                    for (const [k, v] of Object.entries(obj[sec])) { html += `<div class="border-l-2 border-zinc-700 pl-3"><h4 class="text-[10px] font-mono text-zinc-500 uppercase mb-1 font-bold">${escapeHTML(k.replace(/_/g, ' '))}</h4><p class="text-sm text-zinc-300 whitespace-pre-wrap leading-relaxed">${escapeHTML(String(v))}</p></div>`; }
                    html += `</div></div>`;
                }
            }); return html + '</div>';
        }

        function buildRadarHTML(obj) {
            let html = `<div class="flex flex-col gap-4 font-sans"><div class="bg-indigo-950/20 border border-indigo-900/50 rounded-xl p-4 sm:p-5 shadow-sm"><h2 class="text-lg font-bold text-indigo-300 flex items-center gap-2"><i class="ph ph-broadcast text-xl"></i> Pre-Market Radar: ${escapeHTML(obj.radar_date)}</h2><p class="text-sm text-indigo-200/80 mt-2">${escapeHTML(obj.market_sentiment_summary)}</p></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
            if (obj.stock_updates) {
                obj.stock_updates.forEach(s => {
                    let b = "bg-zinc-900 text-zinc-400 border-zinc-700", border = "border-zinc-800 bg-zinc-900/50";
                    if (s.sentiment === "Negative" || s.severity === "High") { b = "bg-rose-950 text-rose-400 border-rose-800/50"; border = "border-rose-900/30 bg-zinc-900/50"; } else if (s.sentiment === "Positive") { b = "bg-emerald-950 text-emerald-400 border-emerald-800/50"; border = "border-emerald-900/30 bg-zinc-900/50"; }
                    html += `<div class="border ${border} p-4 rounded-xl flex flex-col shadow-sm"><div class="flex justify-between items-start mb-3 gap-2"><h3 class="font-bold text-zinc-100 font-mono">${escapeHTML(s.ticker)}</h3><span class="text-[9px] uppercase tracking-widest font-bold px-2 py-1 rounded-md border ${b} shrink-0 text-center">${escapeHTML(s.sentiment)} • ${escapeHTML(s.severity)}</span></div><p class="text-[13px] text-zinc-300 whitespace-pre-wrap leading-relaxed">${escapeHTML(s.news_summary)}</p></div>`;
                });
            } return html + '</div></div>';
        }

        initApp();
    </script>
</body>
</html>
