
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile AI Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .message-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-gray-800">

    <header class="bg-white shadow-sm p-4 flex items-center justify-center sticky top-0 z-10">
        <h1 class="text-xl font-semibold flex items-center gap-2 text-indigo-600">
            <i class="ph ph-sparkle text-2xl"></i>
            AI Search
        </h1>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar pb-24">
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3 opacity-60" id="welcome-screen">
            <i class="ph ph-magnifying-glass text-5xl mb-2"></i>
            <h2 class="text-lg font-medium">What do you want to know?</h2>
            <p class="text-sm px-8">Powered by Puter.js</p>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-3 pb-safe">
        <form id="search-form" class="relative flex items-center gap-2 max-w-lg mx-auto">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Ask anything..." 
                class="w-full bg-gray-100 rounded-full py-3 pl-5 pr-12 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500"
                autocomplete="off"
            >
            <button 
                type="submit" 
                id="submit-btn"
                class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform disabled:opacity-50 disabled:bg-gray-400"
            >
                <i class="ph ph-paper-plane-right text-xl"></i>
            </button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const submitBtn = document.getElementById('submit-btn');
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');

        function formatText(text) {
            if (text === null || text === undefined) return '';
            let safeText = typeof text === 'string' ? text : JSON.stringify(text);
            let formatted = safeText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function addMessage(text, isUser = false) {
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            
            if (isUser) {
                bubble.className = 'bg-indigo-600 text-white px-5 py-3 rounded-2xl rounded-br-sm max-w-[85%] text-base shadow-sm';
                bubble.textContent = text;
            } else {
                bubble.className = 'bg-white border border-gray-200 text-gray-800 px-5 py-3 rounded-2xl rounded-bl-sm max-w-[90%] text-base shadow-sm leading-relaxed overflow-x-auto';
                bubble.innerHTML = formatText(text);
            }

            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function showLoading() {
            const loaderDiv = document.createElement('div');
            loaderDiv.id = 'loading-indicator';
            loaderDiv.className = 'flex w-full justify-start message-enter';
            loaderDiv.innerHTML = `
                <div class="bg-white border border-gray-200 px-4 py-3 rounded-2xl rounded-bl-sm shadow-sm flex items-center gap-2">
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>
            `;
            chatContainer.appendChild(loaderDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoading() {
            const loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const query = input.value.trim();
            if (!query) return;

            addMessage(query, true);
            input.value = '';
            input.disabled = true;
            submitBtn.disabled = true;
            input.blur(); 
            showLoading();

            try {
                if (typeof puter === 'undefined') {
                    throw new Error("Puter.js script did not load.");
                }

                // CHANGED: Removed the specific model constraint to use Puter's guaranteed default AI
                const response = await puter.ai.chat(query);

                removeLoading();
                
                let finalMessage = "";
                if (typeof response === 'string') {
                    finalMessage = response; 
                } else if (response && typeof response.message === 'string') {
                    finalMessage = response.message; 
                } else if (response && response.message && typeof response.message.content === 'string') {
                    finalMessage = response.message.content;
                } else if (response && typeof response.text === 'string') {
                    finalMessage = response.text;
                } else {
                    finalMessage = response; 
                }

                addMessage(finalMessage, false);

            } catch (error) {
                removeLoading();
                console.error("Detailed Error:", error);
                addMessage(`⚠️ **Error Details:**<br>${error.message || JSON.stringify(error)}`, false);
            } finally {
                input.disabled = false;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
