```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile AI Search</title>
    <!-- Tailwind CSS for mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Puter.js for Claude 3.5 Sonnet AI -->
    <script src="https://js.puter.com/v2/"></script>
    <!-- Phosphor Icons for a premium look -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #f3f4f6; /* Tailwind gray-100 */
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        
        /* Smooth transition for the chat bubble appearing */
        .message-enter {
            animation: slideUp 0.3s ease-out forwards;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col font-sans text-gray-800">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 flex items-center justify-center sticky top-0 z-10">
        <h1 class="text-xl font-semibold flex items-center gap-2 text-indigo-600">
            <i class="ph ph-sparkle text-2xl"></i>
            Sonnet Search
        </h1>
    </header>

    <!-- Chat/Results Area -->
    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 no-scrollbar pb-24">
        
        <!-- Welcome Message -->
        <div class="flex flex-col items-center justify-center h-full text-center space-y-3 opacity-60" id="welcome-screen">
            <i class="ph ph-magnifying-glass text-5xl mb-2"></i>
            <h2 class="text-lg font-medium">What do you want to know?</h2>
            <p class="text-sm px-8">Powered by Claude 3.5 Sonnet via Puter.js</p>
        </div>

    </main>

    <!-- Fixed Input Area at Bottom -->
    <footer class="fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 p-3 pb-safe">
        <form id="search-form" class="relative flex items-center gap-2 max-w-lg mx-auto">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Ask anything..." 
                class="w-full bg-gray-100 rounded-full py-3 pl-5 pr-12 text-base focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow"
                autocomplete="off"
            >
            <button 
                type="submit" 
                id="submit-btn"
                class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform disabled:opacity-50 disabled:bg-gray-400"
            >
                <i class="ph ph-paper-plane-right text-xl"></i>
            </button>
        </form>
    </footer>

    <script>
        const form = document.getElementById('search-form');
        const input = document.getElementById('search-input');
        const submitBtn = document.getElementById('submit-btn');
        const chatContainer = document.getElementById('chat-container');
        const welcomeScreen = document.getElementById('welcome-screen');

        // Render Markdown-like bold text simply
        function formatText(text) {
            // Replace **text** with <strong>text</strong>
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Replace newlines with <br>
            formatted = formatted.replace(/\n/g, '<br>');
            return formatted;
        }

        function addMessage(text, isUser = false) {
            if (welcomeScreen) welcomeScreen.style.display = 'none';

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex w-full message-enter ${isUser ? 'justify-end' : 'justify-start'}`;

            const bubble = document.createElement('div');
            
            if (isUser) {
                bubble.className = 'bg-indigo-600 text-white px-5 py-3 rounded-2xl rounded-br-sm max-w-[85%] text-base shadow-sm';
                bubble.textContent = text;
            } else {
                bubble.className = 'bg-white border border-gray-200 text-gray-800 px-5 py-3 rounded-2xl rounded-bl-sm max-w-[90%] text-base shadow-sm leading-relaxed';
                bubble.innerHTML = formatText(text);
            }

            msgDiv.appendChild(bubble);
            chatContainer.appendChild(msgDiv);
            
            // Auto-scroll to bottom
            chatContainer.scrollTo({
                top: chatContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        function showLoading() {
            const loaderDiv = document.createElement('div');
            loaderDiv.id = 'loading-indicator';
            loaderDiv.className = 'flex w-full justify-start message-enter';
            
            loaderDiv.innerHTML = `
                <div class="bg-white border border-gray-200 px-4 py-3 rounded-2xl rounded-bl-sm shadow-sm flex items-center gap-2">
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                    <div class="w-2 h-2 bg-indigo-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                </div>
            `;
            
            chatContainer.appendChild(loaderDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function removeLoading() {
            const loader = document.getElementById('loading-indicator');
            if (loader) loader.remove();
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const query = input.value.trim();
            if (!query) return;

            // 1. Show user message
            addMessage(query, true);
            input.value = '';
            
            // 2. Disable input & show loading
            input.disabled = true;
            submitBtn.disabled = true;
            input.blur(); // Dismiss mobile keyboard
            showLoading();

            try {
                // Ensure Puter is ready
                if (typeof puter === 'undefined') {
                    throw new Error("Puter.js hasn't loaded yet. Check your connection.");
                }

                // 3. Call Claude 3.5 Sonnet via Puter
                const response = await puter.ai.chat(
                    `You are a helpful, concise AI assistant tailored for mobile reading. Answer the following: ${query}`, 
                    { model: 'claude-3-5-sonnet' }
                );

                removeLoading();
                
                // 4. Show AI response
                if (response && response.message) {
                    addMessage(response.message, false);
                } else {
                    addMessage("Sorry, I received an empty response. Please try again.", false);
                }

            } catch (error) {
                removeLoading();
                console.error("Puter Error:", error);
                
                // Handle rate limits or network issues gracefully
                let errorMsg = "An error occurred connecting to the AI.";
                if (error.message.includes("rate limit") || error.message.includes("429")) {
                    errorMsg = "We're receiving too many requests right now. Please wait a moment and try again.";
                }
                
                addMessage(`⚠️ ${errorMsg}`, false);
            } finally {
                // 5. Re-enable input
                input.disabled = false;
                submitBtn.disabled = false;
                // Optional: input.focus(); // Re-open keyboard (can be annoying on mobile)
            }
        });
    </script>
</body>
</html>
