<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institutional Forensic Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .active-btn { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen">

    <header class="p-4 border-b border-gray-800 bg-gray-900 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <h1 class="text-xs font-black uppercase tracking-widest text-emerald-500">Forensic Terminal v2.0</h1>
            <select id="stockSelector" class="bg-gray-800 text-xs px-3 py-1 rounded border border-gray-700">
                <option value="">SELECT ASSET...</option>
                <option value="Acutaas_Chemicals">Acutaas Chemicals</option>
                <option value="Lumax_Auto_Technologies">Lumax Auto Technologies</option>
            </select>
        </div>
    </header>

    <main class="max-w-5xl mx-auto p-4">
        <!-- KPI Row -->
        <div id="kpiGrid" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-6 hidden">
            <div class="bg-gray-900 p-3 rounded border border-gray-800"><p class="text-[10px] text-gray-500 uppercase">P/E</p><p id="v-pe" class="font-mono text-sm font-bold"></p></div>
            <div class="bg-gray-900 p-3 rounded border border-gray-800"><p class="text-[10px] text-gray-500 uppercase">ROCE</p><p id="v-roce" class="font-mono text-sm font-bold"></p></div>
            <div class="bg-gray-900 p-3 rounded border border-gray-800"><p class="text-[10px] text-gray-500 uppercase">Pledge</p><p id="v-pledge" class="font-mono text-sm font-bold"></p></div>
            <div class="bg-gray-900 p-3 rounded border border-gray-800"><p class="text-[10px] text-gray-500 uppercase">Verdict</p><p id="v-verdict" class="font-mono text-sm font-bold text-emerald-400"></p></div>
        </div>

        <!-- Navigation -->
        <div id="navTabs" class="flex space-x-4 border-b border-gray-800 pb-2 mb-6 overflow-x-auto scrollbar-none hidden">
            <button onclick="showTab('gov')" class="tab-link active-btn text-[10px] font-bold uppercase py-1">Gov</button>
            <button onclick="showTab('ops')" class="tab-link text-[10px] font-bold uppercase py-1 text-gray-500">Ops</button>
            <button onclick="showTab('moat')" class="tab-link text-[10px] font-bold uppercase py-1 text-gray-500">Moat</button>
            <button onclick="showTab('fin')" class="tab-link text-[10px] font-bold uppercase py-1 text-gray-500">Fin</button>
            <button onclick="showTab('thesis')" class="tab-link text-[10px] font-bold uppercase py-1 text-gray-500">Thesis</button>
            <button onclick="showTab('val')" class="tab-link text-[10px] font-bold uppercase py-1 text-gray-500">Val</button>
            <button onclick="showTab('news')" class="tab-link text-[10px] font-bold uppercase py-1 text-gray-500">News</button>
        </div>

        <!-- Panels -->
        <div id="panels" class="space-y-4">
            <!-- Content will be injected here -->
        </div>
    </main>

    <script>
        const stockSelector = document.getElementById('stockSelector');
        
        stockSelector.addEventListener('change', async (e) => {
            const file = `forensic_reports/${e.target.value}_Forensic_Report.json`;
            const res = await fetch(file);
            const data = await res.json();
            
            document.getElementById('kpiGrid').classList.remove('hidden');
            document.getElementById('navTabs').classList.remove('hidden');
            
            // Populate KPIs
            document.getElementById('v-pe').innerText = data.kpis.trailing_pe;
            document.getElementById('v-roce').innerText = data.kpis.roce_5yr_median + '%';
            document.getElementById('v-pledge').innerText = data.kpis.promoter_pledging_pct + '%';
            document.getElementById('v-verdict').innerText = data.kpis.final_verdict;

            // Build Panels
            const panelsContainer = document.getElementById('panels');
            panelsContainer.innerHTML = `
                <div id="gov" class="tab-panel active"><h2 class="text-emerald-500 font-bold text-xs uppercase mb-2">Governance</h2><div class="text-xs text-gray-300 space-y-2">${Object.entries(data.governance).map(([k, v]) => `<p><strong>${k.replace('_', ' ')}:</strong> ${v}</p>`).join('')}</div></div>
                <div id="ops" class="tab-panel"><h2 class="text-emerald-500 font-bold text-xs uppercase mb-2">Operations</h2><div class="text-xs text-gray-300 space-y-2">${Object.entries(data.operations).map(([k, v]) => `<p><strong>${k.replace('_', ' ')}:</strong> ${v}</p>`).join('')}</div></div>
                <div id="moat" class="tab-panel"><h2 class="text-emerald-500 font-bold text-xs uppercase mb-2">Moat</h2><div class="text-xs text-gray-300 space-y-2">${Object.entries(data.moat_and_industry).map(([k, v]) => `<p><strong>${k.replace('_', ' ')}:</strong> ${v}</p>`).join('')}</div></div>
                <div id="fin" class="tab-panel"><h2 class="text-emerald-500 font-bold text-xs uppercase mb-2">Financials</h2><div class="text-xs text-gray-300 space-y-2">${Object.entries(data.financial_forensics).map(([k, v]) => `<p><strong>${k.replace('_', ' ')}:</strong> ${v}</p>`).join('')}</div></div>
                <div id="thesis" class="tab-panel"><h2 class="text-emerald-500 font-bold text-xs uppercase mb-2">Thesis</h2><div class="text-xs text-gray-300 space-y-2">${Object.entries(data.thesis_and_risks).map(([k, v]) => `<p><strong>${k.replace('_', ' ')}:</strong> ${v}</p>`).join('')}</div></div>
                <div id="val" class="tab-panel"><h2 class="text-emerald-500 font-bold text-xs uppercase mb-2">Valuation</h2><div class="text-xs text-gray-300 space-y-2">${Object.entries(data.valuation_matrix).map(([k, v]) => typeof v === 'object' ? `<p><strong>${k}:</strong> ${JSON.stringify(v)}</p>` : `<p><strong>${k}:</strong> ${v}</p>`).join('')}</div></div>
                <div id="news" class="tab-panel"><h2 class="text-emerald-500 font-bold text-xs uppercase mb-2">Catalysts</h2><div class="text-xs text-gray-300 space-y-2">${Object.entries(data.catalysts_and_sentiment).map(([k, v]) => `<p><strong>${k.replace('_', ' ')}:</strong> ${v}</p>`).join('')}</div></div>
            `;
        });

        function showTab(id) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-link').forEach(l => l.classList.remove('active-btn'));
            document.getElementById(id).classList.add('active');
            event.target.classList.add('active-btn');
        }
    </script>
</body>
</html>
