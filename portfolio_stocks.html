<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forensic Equity Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn.active { border-bottom: 2px solid #10b981; color: #10b981; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .formatted-list { list-style-type: decimal; padding-left: 1.25rem; }
        .formatted-list li { margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 antialiased p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <header class="mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tighter">Forensic Terminal</h1>
            <select id="stockSelector" class="mt-4 w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg text-sm">
                <option value="">-- SELECT ASSET --</option>
            </select>
        </header>

        <div id="dashboard" class="hidden space-y-6">
            <!-- Metadata and KPIs Row -->
            <div id="metaKpi" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            
            <!-- Dynamic Tab Navigation -->
            <div id="tabNav" class="flex space-x-6 overflow-x-auto pb-2 border-b border-slate-800"></div>
            
            <!-- Tab Content Area -->
            <div id="tabContainer" class="bg-slate-900 p-6 rounded-lg border border-slate-800 min-h-[300px]"></div>
        </div>
    </div>

    <script>
        const assets = ["Acutaas_Chemicals", "BEL", "Bajajcon", "Bliss_GVS_Pharma", "CCL", "Lumax_Auto_Technologies", "Maithan_Alloys", "cgpower", "cupid", "dixon", "geship", "hdfcamc"];
        const selector = document.getElementById('stockSelector');
        
        assets.forEach(a => selector.innerHTML += `<option value="${a}">${a.replace(/_/g, ' ')}</option>`);

        // Formatter: Detects numbered patterns and formats them as lists
        function formatSectionText(text) {
            if (typeof text !== 'string') return text;
            const lines = text.split(/\n/);
            const formatted = lines.map(line => {
                if (/^\d+\./.test(line.trim())) return `<li>${line.replace(/^\d+\.\s*/, '')}</li>`;
                return line.trim() ? `<p class="mb-2">${line}</p>` : '';
            }).join('');
            return `<ul class="formatted-list">${formatted}</ul>`;
        }

        selector.addEventListener('change', async (e) => {
            if(!e.target.value) return;
            // Standard pathing as confirmed functional
            const path = `forensic_reports/${e.target.value}_Forensic_Report.json`;
            const res = await fetch(path);
            render(await res.json());
        });

        function render(data) {
            document.getElementById('dashboard').classList.remove('hidden');
            
            // Metadata + KPIs
            document.getElementById('metaKpi').innerHTML = `
                <div class="bg-slate-900 p-4 rounded border border-slate-800">
                    <h3 class="text-[10px] uppercase text-emerald-500 font-bold mb-3">Metadata</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-400">
                        ${Object.entries(data.metadata).map(([k,v])=>`<div><span class="capitalize">${k.replace('_',' ')}:</span> <span class="text-white">${v}</span></div>`).join('')}
                    </div>
                </div>
                <div class="bg-slate-900 p-4 rounded border border-slate-800">
                    <h3 class="text-[10px] uppercase text-emerald-500 font-bold mb-3">KPIs</h3>
                    <div class="grid grid-cols-2 gap-2 text-xs text-slate-400">
                        ${Object.entries(data.kpis).map(([k,v])=>`<div><span class="capitalize">${k.replace('_',' ')}:</span> <span class="text-white">${v}</span></div>`).join('')}
                    </div>
                </div>`;

            // Tab Generation
            const nav = document.getElementById('tabNav');
            const container = document.getElementById('tabContainer');
            nav.innerHTML = ''; container.innerHTML = '';

            const sections = Object.keys(data).filter(k => !['metadata', 'kpis'].includes(k));
            
            sections.forEach((sec, idx) => {
                const isActive = idx === 0 ? 'active' : '';
                nav.innerHTML += `<button onclick="switchTab('${sec}')" id="btn-${sec}" class="tab-btn ${isActive} text-[11px] font-bold uppercase whitespace-nowrap pb-2 transition-colors">${sec.replace(/_/g, ' ')}</button>`;
                container.innerHTML += `
                    <div id="tab-${sec}" class="tab-content ${isActive}">
                        <div class="space-y-4">
                            ${typeof data[sec] === 'object' ? Object.entries(data[sec]).map(([k, v]) => `
                                <div>
                                    <h4 class="text-[10px] font-bold text-emerald-500 uppercase">${k.replace(/_/g, ' ')}</h4>
                                    <div class="text-sm text-slate-300 mt-1">${formatSectionText(v)}</div>
                                </div>`).join('') : formatSectionText(data[sec])}
                        </div>
                    </div>`;
            });
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.getElementById(`btn-${id}`).classList.add('active');
        }
    </script>
</body>
</html>
