```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal | Forensic Analysis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-300 font-sans">

    <div class="max-w-7xl mx-auto p-4 md:p-8">
        <!-- Search & Control -->
        <div class="flex flex-col md:flex-row justify-between mb-8 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tighter">Forensic Portfolio Terminal</h1>
                <p class="text-xs text-slate-500 uppercase tracking-widest">Autonomous Data Engine v4.0</p>
            </div>
            <select id="stockSelector" class="bg-slate-900 border border-slate-700 text-white rounded-lg px-4 py-2 w-full md:w-80 cursor-pointer focus:ring-2 focus:ring-emerald-500 transition-all">
                <option value="">-- SELECT ASSET --</option>
            </select>
        </div>

        <div id="dashboard" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Sidebar Metrics -->
            <aside class="lg:col-span-3 space-y-4" id="kpiSidebar"></aside>
            <!-- Main Detail Pane -->
            <main class="lg:col-span-9 space-y-6" id="detailPane"></main>
        </div>
    </div>

    <script>
        const CONFIG = {
            assets: ["Acutaas_Chemicals", "BEL", "Bajajcon", "Bliss_GVS_Pharma", "CCL", "Lumax_Auto_Technologies", "Maithan_Alloys", "cgpower", "cupid", "dixon", "geship", "hdfcamc"]
        };

        const selector = document.getElementById('stockSelector');
        CONFIG.assets.forEach(s => selector.innerHTML += `<option value="${s}">${s.replace(/_/g, ' ')}</option>`);

        selector.addEventListener('change', async (e) => {
            if(!e.target.value) return;
            const res = await fetch(`forensic_reports/${e.target.value}_Forensic_Report.json?t=${Date.now()}`);
            const data = await res.json();
            render(data);
        });

        function render(data) {
            document.getElementById('dashboard').classList.remove('hidden');
            
            // Render KPI Sidebar with Forensic Highlighting
            const sidebar = document.getElementById('kpiSidebar');
            sidebar.innerHTML = `
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h3 class="text-xs uppercase font-bold text-slate-500 mb-4">Core Metrics</h3>
                    <div class="space-y-4">
                        ${Object.entries(data.kpis).map(([k, v]) => `
                            <div>
                                <p class="text-[10px] uppercase text-slate-500">${k.replace('_', ' ')}</p>
                                <p class="text-lg font-bold text-white">${v}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;

            // Render Detail Pane
            const pane = document.getElementById('detailPane');
            pane.innerHTML = Object.entries(data).filter(([k]) => !['metadata', 'kpis'].includes(k)).map(([section, subData]) => `
                <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                    <h2 class="text-emerald-500 text-xs font-bold uppercase tracking-widest mb-4 border-b border-slate-800 pb-2">${section.replace('_', ' ')}</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        ${typeof subData === 'object' ? Object.entries(subData).map(([k, v]) => `
                            <div>
                                <h4 class="text-[10px] text-slate-500 uppercase font-bold mb-1">${k.replace(/_/g, ' ')}</h4>
                                <p class="text-sm leading-relaxed text-slate-400">${v}</p>
                            </div>
                        `).join('') : `<p class="text-sm text-slate-400">${subData}</p>`}
                    </div>
                </section>
            `).join('');
        }
    </script>
</body>
</html>
