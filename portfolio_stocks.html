<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forensic Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .tab-btn.active { border-bottom: 2px solid #10b981; color: #10b981; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        /* Smooth touch scrolling for mobile nav */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-300 antialiased p-2 md:p-6">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="mb-4">
            <h1 class="text-xl font-bold text-white tracking-tighter">Forensic Terminal</h1>
            <select id="stockSelector" class="mt-3 w-full bg-slate-900 border border-slate-700 text-white p-3 rounded-lg text-sm">
                <option value="">SELECT ASSET...</option>
            </select>
        </header>

        <div id="dashboard" class="hidden space-y-4">
            <!-- KPI Strip (Horizontal scroll on mobile) -->
            <div id="kpiStrip" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>

            <!-- Tab Navigation -->
            <div id="tabNav" class="flex space-x-6 overflow-x-auto no-scrollbar border-b border-slate-800 pb-2"></div>

            <!-- Content Area -->
            <div id="tabContainer" class="bg-slate-900 p-4 rounded-lg border border-slate-800"></div>
        </div>
    </div>

    <script>
        const assets = ["Acutaas_Chemicals", "BEL", "Bajajcon", "Bliss_GVS_Pharma", "CCL", "Lumax_Auto_Technologies", "Maithan_Alloys", "cgpower", "cupid", "dixon", "geship", "hdfcamc"];
        const selector = document.getElementById('stockSelector');
        assets.forEach(a => selector.innerHTML += `<option value="${a}">${a.replace(/_/g, ' ')}</option>`);

        selector.addEventListener('change', async (e) => {
            if(!e.target.value) return;
            const res = await fetch(`forensic_reports/${e.target.value}_Forensic_Report.json`);
            render(await res.json());
        });

        function render(data) {
            document.getElementById('dashboard').classList.remove('hidden');
            
            // Render KPI Strip
            document.getElementById('kpiStrip').innerHTML = Object.entries(data.kpis).map(([k, v]) => `
                <div class="bg-slate-900 p-3 rounded border border-slate-800">
                    <p class="text-[9px] uppercase text-slate-500">${k.replace(/_/g, ' ')}</p>
                    <p class="text-xs font-bold text-white truncate">${v}</p>
                </div>
            `).join('');

            // Render Tabs
            const nav = document.getElementById('tabNav');
            const container = document.getElementById('tabContainer');
            nav.innerHTML = '';
            container.innerHTML = '';

            const sections = Object.keys(data).filter(k => !['metadata', 'kpis'].includes(k));
            
            sections.forEach((sec, idx) => {
                const isActive = idx === 0 ? 'active' : '';
                nav.innerHTML += `<button onclick="switchTab('${sec}')" id="btn-${sec}" class="tab-btn ${isActive} text-[11px] font-bold uppercase whitespace-nowrap pb-2 transition-colors">${sec.replace(/_/g, ' ')}</button>`;
                
                const content = data[sec];
                container.innerHTML += `
                    <div id="tab-${sec}" class="tab-content ${isActive}">
                        <div class="space-y-4">
                            ${typeof content === 'object' ? Object.entries(content).map(([k, v]) => `
                                <div>
                                    <h4 class="text-[10px] font-bold text-emerald-500 uppercase">${k.replace(/_/g, ' ')}</h4>
                                    <p class="text-sm text-slate-300 mt-1">${v}</p>
                                </div>
                            `).join('') : `<p class="text-sm text-slate-300">${content}</p>`}
                        </div>
                    </div>`;
            });
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${id}`).classList.add('active');
            document.getElementById(`btn-${id}`).classList.add('active');
        }
    </script>
</body>
</html>
