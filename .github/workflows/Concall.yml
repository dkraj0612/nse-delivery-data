name: Autonomous Concall Engine

on:
  schedule:
    # Wakes up automatically every 4 hours forever
    - cron: '0 */4 * * *'
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches full history to prevent merge conflicts
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Requirements
      run: pip install -r requirements.txt
      
    - name: Execute Sync Engine
      run: python Concall-downloaded.py
      
    - name: Safely Commit Data
      run: |
        git config --local user.email "bot@github.actions.com"
        git config --local user.name "Transcript Bot"
        git add transcripts/
        
        # The Pro Fix: Gracefully pull any external changes before pushing
        git diff-index --quiet HEAD || (git commit -m "Auto-synced latest market transcripts" && git pull --rebase origin main && git push)
