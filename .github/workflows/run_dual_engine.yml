name: Momentum Alpha Engine

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 1 * *' 

permissions:
  contents: write 

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy plotly streamlit google-genai tabulate

      - name: Run Quantitative Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: 1 
        run: |
          # Runs in "Bare Python Mode" to generate the static HTML dashboard & CSVs
          python dual_engine_backtest.py

      - name: Commit and push changes
        if: always() 
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add index.html history.html backtest_portfolio_history.csv audit_progress.json || echo "No files generated"
          git commit -m "Automated AI Audit & Portfolio Update" || echo "No changes to commit"
          git push
