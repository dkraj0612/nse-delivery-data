name: Momentum Alpha Engine

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 0 1 * *' 

permissions:
  contents: write 

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance plotly streamlit google-genai

      - name: Run Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: 1 
        run: |
          # Note: In a Streamlit architecture, this action is mostly for testing if the script compiles.
          # To view the actual interactive UI, deploy the repo via Streamlit Community Cloud.
          python dual_engine_backtest.py

      - name: Commit and push changes
        if: always() 
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Automated update: Architecture dependencies" || echo "No changes to commit"
          git push
