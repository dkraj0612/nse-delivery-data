name: Run Dual-Engine Portfolio & AI Audit

on:
  workflow_dispatch: 

jobs:
  execute-strategy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python Libraries
      run: pip install pandas numpy yfinance tabulate requests google-genai

    - name: Run Backtest and Gemini Audit
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python dual_engine_backtest.py

    - name: Upload HTML Dashboard Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Portfolio-Dashboard
        path: portfolio_dashboard.html
