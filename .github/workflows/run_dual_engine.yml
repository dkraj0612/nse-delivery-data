name: Momentum AI Backtest & Audit

on:
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab
  schedule:
    - cron: '0 0 1 * *' # Optional: Runs automatically on the 1st of every month

permissions:
  contents: write # CRITICAL: Allows the Action to push the files back to your repo

jobs:
  run-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy google-genai

      - name: Run Forensic Backtest & Audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python dual_engine_backtest.py

      - name: Commit and push changes
        if: always() # CRITICAL: Forces GitHub to save your progress even on failure/timeout/cancel
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add the newly generated tracking and web files
          git add index.html history.html audit_progress.json backtest_portfolio_history.csv
          
          # Commit the changes. The [skip ci] prevents an infinite loop of actions triggering actions.
          git commit -m "Automated update: AI Audit Ledger & State [skip ci]" || echo "No changes to commit"
          
          # Push the files to your repository so your GitHub Pages URL updates instantly
          git push
