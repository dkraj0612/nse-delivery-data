name: Strategy Historical Backtest

on:
  workflow_dispatch: # Allows you to run it with a manual button click

jobs:
  backtest-simulation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Initialize Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Quant Packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Multi-Year Simulation & Gemini Audit
      env:
        # CORRECT WAY: This pulls it securely from GitHub's hidden memory vault
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python backtest_pipeline.py
