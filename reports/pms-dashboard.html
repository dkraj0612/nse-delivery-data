<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMS Fund Manager • NSE Delivery Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(255,255,255,0.05); backdrop-filter: blur(12px); }
        .nav-active { border-bottom: 3px solid #22c55e; }
        .card-hover:hover { transform: translateY(-4px); }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <div class="w-72 bg-zinc-900 border-r border-zinc-800 flex flex-col">
            <div class="p-6 border-b border-zinc-800">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center text-black font-bold text-xl">P</div>
                    <div>
                        <h1 class="text-2xl font-semibold">PMS Dashboard</h1>
                        <p class="text-xs text-zinc-500">30+ Years Experience</p>
                    </div>
                </div>
            </div>
            
            <div class="p-6">
                <label class="text-xs font-medium text-zinc-400 mb-2 block">REPORT DATE</label>
                <select id="date-select" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500">
                </select>
            </div>

            <div class="px-6 space-y-2">
                <button onclick="prevDate()" class="w-full bg-zinc-800 hover:bg-zinc-700 py-3 rounded-xl flex items-center justify-center gap-2">
                    <i class="fas fa-chevron-left"></i> Previous
                </button>
            </div>

            <div class="mt-8 px-6">
                <div class="text-xs font-mono text-zinc-500 mb-3">AVAILABLE REPORTS</div>
                <div id="date-list" class="space-y-1 max-h-[400px] overflow-auto"></div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex-1 overflow-auto">
            <div class="bg-zinc-900 border-b border-zinc-800 px-8 py-5 flex items-center justify-between sticky top-0 z-50">
                <div class="flex gap-8">
                    <div onclick="showTab(0)" id="tab-0" class="nav-active cursor-pointer pb-1 text-emerald-400 font-medium">OVERVIEW</div>
                    <div onclick="showTab(1)" id="tab-1" class="cursor-pointer pb-1 text-zinc-400 hover:text-zinc-200 font-medium">PORTFOLIO</div>
                    <div onclick="showTab(2)" id="tab-2" class="cursor-pointer pb-1 text-zinc-400 hover:text-zinc-200 font-medium">FLOWS & SENTIMENT</div>
                </div>
                
                <div class="flex items-center gap-6">
                    <div id="current-date" class="text-right"></div>
                    <button onclick="nextDate()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-2.5 rounded-2xl text-sm font-semibold flex items-center gap-2">
                        NEXT <i class="fas fa-chevron-right"></i>
                    </button>
                </div>
            </div>

            <div class="p-8" id="dashboard-content">
                <!-- Content populated by JS -->
            </div>
        </div>
    </div>

    <script>
        let currentData = null;
        let availableReports = [
            "28_Feb_2026.json", "30_Apr_2026.json", "31_Dec_2025.json",
            "31_Jan_2026.json", "31_Mar_2026.json", "31_May_2026.json"
        ];
        let currentIndex = 0;

        async function loadReport(filename) {
            try {
                const url = `https://raw.githubusercontent.com/dkraj0612/nse-delivery-data/main/reports/${filename}`;
                const res = await fetch(url);
                currentData = await res.json();
                renderDashboard();
            } catch (e) {
                console.error("Failed to load", filename);
                alert("Could not load report. Please refresh.");
            }
        }

        function renderDashboard() {
            if (!currentData) return;

            document.getElementById("current-date").innerHTML = `
                <div class="text-emerald-400 font-medium">${currentData.cutoff_date}</div>
                <div class="text-xs text-zinc-500">NSE Delivery Report</div>
            `;

            let html = `
                <div class="grid grid-cols-12 gap-6">
                    <!-- Market Snapshot -->
                    <div class="col-span-12 lg:col-span-8">
                        <div class="glass border border-zinc-700 rounded-3xl p-8">
                            <h2 class="text-xl font-semibold mb-4">Market Snapshot</h2>
                            <p class="text-zinc-300 leading-relaxed">${currentData.market_snapshot?.text_summary || ''}</p>
                        </div>
                    </div>
                    
                    <!-- Key Drivers -->
                    <div class="col-span-12 lg:col-span-4">
                        <div class="glass border border-zinc-700 rounded-3xl p-8 h-full">
                            <h2 class="text-amber-400 text-sm tracking-widest mb-4">KEY DRIVERS</h2>
                            <p class="text-zinc-300">${currentData.key_drivers?.text_summary || ''}</p>
                        </div>
                    </div>

                    <!-- MIDCP -->
                    <div class="col-span-12 lg:col-span-6">
                        <div class="glass border border-zinc-700 rounded-3xl p-8">
                            <h2 class="mb-4 flex items-center gap-2"><i class="fas fa-chart-bar text-sky-400"></i> MIDCP NIFTY</h2>
                            <p class="text-zinc-300">${currentData.midcp_analysis?.text_summary || ''}</p>
                        </div>
                    </div>

                    <!-- Consistency -->
                    <div class="col-span-12 lg:col-span-6">
                        <div class="glass border border-zinc-700 rounded-3xl p-8">
                            <h2 class="mb-4 flex items-center gap-2"><i class="fas fa-shield-alt text-violet-400"></i> CONSISTENCY CHECK</h2>
                            <p class="text-zinc-300">${currentData.consistency_check?.text_summary || ''}</p>
                        </div>
                    </div>

                    <!-- Sector Flows & Sentiment -->
                    <div class="col-span-12 lg:col-span-7">
                        <div class="glass border border-zinc-700 rounded-3xl p-8">
                            <h2 class="text-rose-400 text-sm tracking-widest mb-4">SECTORAL OPTION FLOWS</h2>
                            <p class="text-zinc-300">${currentData.sectoral_option_flows?.text_summary || ''}</p>
                        </div>
                    </div>
                    <div class="col-span-12 lg:col-span-5">
                        <div class="glass border border-zinc-700 rounded-3xl p-8">
                            <h2 class="text-sky-400 text-sm tracking-widest mb-4">X SENTIMENT</h2>
                            <p class="text-zinc-300">${currentData.x_sentiment?.text_summary || ''}</p>
                        </div>
                    </div>
                </div>

                <!-- Portfolio Section -->
                <div class="mt-10">
                    <h2 class="text-2xl font-semibold mb-6">Model Portfolio Holdings</h2>
                    <div class="glass border border-zinc-700 rounded-3xl p-8">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-zinc-700 text-xs text-zinc-400">
                                    <th class="text-left py-4">Stock</th>
                                    <th class="text-left py-4">Ticker</th>
                                    <th class="text-right py-4">Allocation</th>
                                </tr>
                            </thead>
                            <tbody id="portfolio-body" class="text-sm"></tbody>
                        </table>
                    </div>
                </div>
            `;

            document.getElementById("dashboard-content").innerHTML = html;
            renderPortfolioTable();
            updateDateSelector();
        }

        function renderPortfolioTable() {
            const tbody = document.getElementById("portfolio-body");
            const holdings = currentData.model_portfolio?.portfolio_holdings || [];
            let rows = '';

            holdings.forEach(h => {
                rows += `
                    <tr class="border-b border-zinc-800 hover:bg-zinc-900">
                        <td class="py-5 font-medium">${h.stock_name}</td>
                        <td class="py-5 text-emerald-400 font-mono">${h.ticker || h.symbol || '-'}</td>
                        <td class="py-5 text-right font-semibold">${h.allocation_pct}%</td>
                    </tr>
                `;
            });

            tbody.innerHTML = rows;
        }

        function updateDateSelector() {
            const select = document.getElementById("date-select");
            select.innerHTML = "";
            const list = document.getElementById("date-list");

            availableReports.forEach((file, i) => {
                const dateStr = file.replace(".json", "").replace(/_/g, " ");
                const option = new Option(dateStr, i);
                if (i === currentIndex) option.selected = true;
                select.appendChild(option);

                const div = document.createElement("div");
                div.className = `px-4 py-3 rounded-2xl cursor-pointer ${i === currentIndex ? 'bg-emerald-900 text-emerald-300' : 'hover:bg-zinc-800'}`;
                div.textContent = dateStr;
                div.onclick = () => { currentIndex = i; loadReport(file); };
                list.appendChild(div);
            });
        }

        function showTab(n) {
            // For now all in one view. Can be expanded later.
        }

        function prevDate() {
            if (currentIndex > 0) {
                currentIndex--;
                loadReport(availableReports[currentIndex]);
            }
        }

        function nextDate() {
            if (currentIndex < availableReports.length - 1) {
                currentIndex++;
                loadReport(availableReports[currentIndex]);
            }
        }

        // Initialize
        window.onload = () => {
            loadReport(availableReports[0]);
        };
    </script>
</body>
</html>
