<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(16px); }
        .nav-active { border-bottom: 3px solid #22c55e; color: #22c55e; font-weight: 600; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .mobile-tab { font-size: 0.95rem; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen pb-20">
    <!-- Top Header -->
    <div class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="px-4 py-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-emerald-500 text-black font-bold rounded-2xl flex items-center justify-center text-2xl shadow-lg shadow-emerald-500/20">P</div>
                <div>
                    <h1 class="text-2xl font-semibold">PMS Dashboard</h1>
                    <p class="text-xs text-emerald-400 font-semibold tracking-widest uppercase">Quantitative Strategy</p>
                </div>
            </div>
            
            <!-- Controls (Nav Buttons & Dropdown) -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between">
                <div class="flex items-center bg-zinc-800 rounded-xl border border-zinc-700 overflow-hidden shrink-0">
                    <button id="btn-prev" onclick="navigateReport(-1)" class="px-3 md:px-4 py-2 text-zinc-400 hover:text-white hover:bg-zinc-700 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors" title="Previous Month">
                        <i class="fa-solid fa-chevron-left text-sm"></i>
                    </button>
                    <div class="w-px h-5 bg-zinc-700"></div>
                    <button id="btn-next" onclick="navigateReport(1)" class="px-3 md:px-4 py-2 text-zinc-400 hover:text-white hover:bg-zinc-700 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors" title="Next Month">
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </button>
                </div>
                <select id="date-select" class="bg-zinc-800 text-sm font-mono border border-zinc-700 rounded-xl px-3 md:px-4 py-2 focus:outline-none w-full md:w-auto"></select>
            </div>
        </div>
        
        <!-- Mobile Tabs -->
        <div class="flex border-t border-zinc-800 bg-zinc-900 overflow-x-auto">
            <button onclick="showTab(0)" id="tab-0" class="nav-active mobile-tab flex-1 py-4 text-center transition-colors">Overview</button>
            <button onclick="showTab(1)" id="tab-1" class="mobile-tab flex-1 py-4 text-center text-zinc-400 transition-colors">Portfolio</button>
            <button onclick="showTab(2)" id="tab-2" class="mobile-tab flex-1 py-4 text-center text-zinc-400 transition-colors">Outlook</button>
        </div>
    </div>

    <div class="p-4 md:p-6 max-w-5xl mx-auto" id="dashboard-content"></div>

    <script>
        let currentData = null;
        let availableReports = [
            "28_Feb_2026.json",
            "30_Apr_2026.json",
            "31_Dec_2025.json",
            "31_Jan_2026.json",
            "31_Mar_2026.json",
            "31_May_2026.json"
        ];
        
        // Sort dates chronologically
        availableReports.sort((a, b) => {
            let dateA = new Date(a.replace(/_/g, '-').replace('.json', ''));
            let dateB = new Date(b.replace(/_/g, '-').replace('.json', ''));
            return dateA - dateB; 
        });

        let currentIndex = availableReports.length - 1;
        let chart = null;

        // Currency formatter for Indian Rupees
        const formatINR = (num) => {
            if (num === undefined || num === null) return '--';
            return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);
        };

        async function loadReport(filename) {
            document.getElementById('dashboard-content').innerHTML = `
                <div class="flex flex-col justify-center items-center h-64 text-zinc-500">
                    <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-4 text-emerald-500"></i>
                    <p class="text-sm font-mono tracking-wide">Loading ${filename}...</p>
                </div>
            `;
            try {
                const url = `https://raw.githubusercontent.com/dkraj0612/nse-delivery-data/main/reports/${filename}?t=${Date.now()}`;
                const res = await fetch(url);
                currentData = await res.json();
                
                let activeTabEl = document.querySelector('.nav-active');
                let activeTabIdx = activeTabEl ? parseInt(activeTabEl.id.split('-')[1]) : 0;
                
                showTab(activeTabIdx); 
                updateDateSelector();
            } catch(e) {
                console.error("Load failed", e);
                document.getElementById("dashboard-content").innerHTML = `<div class="p-8 text-center text-rose-400 border border-rose-900 bg-rose-950/20 rounded-2xl">Error loading data.</div>`;
            }
        }

        function navigateReport(direction) {
            let newIndex = currentIndex + direction;
            if(newIndex >= 0 && newIndex < availableReports.length) {
                currentIndex = newIndex;
                loadReport(availableReports[currentIndex]);
            }
        }

        function renderOverview() {
            if(!currentData) return;
            const html = `
                <div class="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                    <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                        <h2 class="font-semibold text-lg mb-4 flex items-center gap-2"><i class="fas fa-chart-line text-emerald-500"></i> Market Snapshot</h2>
                        <p class="text-zinc-300 leading-relaxed whitespace-pre-line">${currentData.market_snapshot?.text_summary || ''}</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                            <h2 class="text-amber-400 mb-4 text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-bolt mr-2"></i>Key Drivers</h2>
                            <p class="text-zinc-300 text-sm leading-relaxed">${currentData.key_drivers?.text_summary || ''}</p>
                        </div>
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                            <h2 class="text-sky-400 mb-4 text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-magnifying-glass-chart mr-2"></i>Midcap Analysis</h2>
                            <p class="text-zinc-300 text-sm leading-relaxed">${currentData.midcp_analysis?.text_summary || ''}</p>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                            <h2 class="text-rose-400 mb-4 text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-water mr-2"></i>Sectoral Option Flows</h2>
                            <p class="text-zinc-300 text-sm leading-relaxed">${currentData.sectoral_option_flows?.text_summary || ''}</p>
                        </div>
                        
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                            <h2 class="text-emerald-400 mb-4 text-sm font-bold tracking-widest uppercase"><i class="fa-brands fa-x-twitter mr-2"></i>X Sentiment</h2>
                            <p class="text-zinc-300 text-sm leading-relaxed">${currentData.x_sentiment?.text_summary || ''}</p>
                        </div>
                    </div>

                    <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                        <h2 class="text-purple-400 mb-4 text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-clock-rotate-left mr-2"></i>Consistency Check</h2>
                        <p class="text-zinc-300 leading-relaxed">${currentData.consistency_check?.text_summary || 'No consistency check generated for this month.'}</p>
                    </div>
                </div>
            `;
            document.getElementById("dashboard-content").innerHTML = html;
        }

        function renderPortfolio() {
            if(!currentData) return;
            
            const pData = currentData.model_portfolio || {};
            const accounting = pData.accounting_state || {};
            const metrics = pData.metrics || {};
            
            // Core Metrics Mapping
            const aum = accounting.total_aum_inr;
            const nav = accounting.current_nav;
            const cashVal = accounting.cash_balance_inr;
            
            const ret = metrics.cumulative_return_pct !== undefined ? metrics.cumulative_return_pct : metrics.total_return_pct;
            const dd = accounting.current_drawdown_pct !== undefined ? accounting.current_drawdown_pct : metrics.max_drawdown_pct;
            const winRate = metrics.core_portfolio_win_rate_pct !== undefined ? metrics.core_portfolio_win_rate_pct : metrics.win_rate_pct;
            const tacticalWinRate = metrics.tactical_bets_win_rate_pct;

            // 1. Process Core Open Positions
            const rawHoldings = pData.open_positions || pData.portfolio_holdings || [];
            let chartLabels = [];
            let chartData = [];
            
            let holdingsHTML = rawHoldings.map(h => {
                let entryPrice = h.entry_price !== undefined ? h.entry_price : h.entry_price_inr;
                let currentPrice = h.close_price_as_of_cutoff !== undefined ? h.close_price_as_of_cutoff : h.current_price;
                let slPrice = h.stop_loss_price !== undefined ? h.stop_loss_price : h.stop_loss;
                let pnl = h.unrealized_pnl_pct !== undefined ? h.unrealized_pnl_pct : h.real_pnl_pct;
                
                // Calculate accurate allocation
                let positionValue = h.quantity && currentPrice ? h.quantity * currentPrice : 0;
                let allocPct = 0;
                if (aum && positionValue > 0) {
                    allocPct = ((positionValue / aum) * 100).toFixed(1);
                } else if (h.allocation_pct) {
                    allocPct = h.allocation_pct.toFixed(1);
                }

                if (allocPct > 0) {
                    chartLabels.push(h.ticker);
                    chartData.push(allocPct);
                }
                
                let pnlColor = pnl >= 0 ? 'text-emerald-400' : 'text-rose-400';
                let pnlSign = pnl > 0 ? '+' : '';

                // NEW: Entry Date Badge
                let entryDateBadge = h.entry_date ? `<span class="bg-zinc-800/80 text-sky-300 text-xs px-2 py-1 rounded border border-sky-900/30 font-mono"><i class="fa-regular fa-calendar mr-1"></i>${h.entry_date}</span>` : '';
                
                return `
                <div class="border-b border-zinc-800 py-5 last:border-none hover:bg-zinc-800/20 px-2 rounded-xl transition-colors">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="font-semibold text-lg text-emerald-400 tracking-wider">${h.ticker || 'N/A'}</div>
                            
                            <div class="flex flex-wrap gap-2 mt-2 mb-2">
                                ${entryDateBadge}
                                <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">Qty: ${h.quantity || '--'}</span>
                                <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">In: ₹${entryPrice || '--'}</span>
                                <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">CMP: ₹${currentPrice || '--'}</span>
                                <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">SL: ₹${slPrice || '--'}</span>
                                <span class="${pnlColor} bg-zinc-900 text-xs font-bold px-2 py-1 rounded border border-zinc-800 font-mono">PnL: ${pnlSign}${pnl || 0}%</span>
                            </div>
                        </div>
                        <div class="text-right ml-4">
                            <div class="text-[10px] text-zinc-500 uppercase font-semibold tracking-widest">Weight</div>
                            <div class="text-2xl font-bold font-mono">${allocPct}%</div>
                        </div>
                    </div>
                    <div class="text-xs text-zinc-400 mt-2 border-l-2 border-emerald-900/50 pl-3 italic">${h.rationale || ''}</div>
                </div>
                `;
            }).join('');

            // 2. Process Open Tactical Bets (High Conviction Positions)
            const openTactical = pData.open_tactical_bets || [];
            let openTacticalHTML = '';
            if (openTactical.length > 0) {
                openTacticalHTML = openTactical.map(t => {
                    let entryPrice = t.entry_price !== undefined ? t.entry_price : t.entry_price_inr;
                    let currentPrice = t.close_price_as_of_cutoff !== undefined ? t.close_price_as_of_cutoff : t.current_price;
                    let slPrice = t.stop_loss_price !== undefined ? t.stop_loss_price : t.stop_loss;
                    let pnl = t.unrealized_pnl_pct !== undefined ? t.unrealized_pnl_pct : t.real_pnl_pct;
                    let pnlColor = pnl >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    let pnlSign = pnl > 0 ? '+' : '';

                    // NEW: Entry Date Badge for Tactical
                    let entryDateBadge = t.entry_date ? `<span class="bg-zinc-800/80 text-amber-300/80 text-xs px-2 py-1 rounded border border-amber-900/30 font-mono"><i class="fa-regular fa-calendar mr-1"></i>${t.entry_date}</span>` : '';

                    return `
                    <div class="border-b border-zinc-800 py-4 last:border-none hover:bg-zinc-800/20 px-2 rounded-xl transition-colors">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="font-semibold text-base text-amber-400 tracking-wider">${t.ticker || 'N/A'}</div>
                                <div class="flex flex-wrap gap-2 mt-2 mb-1">
                                    ${entryDateBadge}
                                    <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">Qty: ${t.quantity || '--'}</span>
                                    <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">In: ₹${entryPrice || '--'}</span>
                                    <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">CMP: ₹${currentPrice || '--'}</span>
                                    <span class="bg-zinc-800/80 text-zinc-300 text-xs px-2 py-1 rounded border border-zinc-700/50 font-mono">SL: ₹${slPrice || '--'}</span>
                                    <span class="${pnlColor} bg-zinc-900 text-xs font-bold px-2 py-1 rounded border border-zinc-800 font-mono">PnL: ${pnlSign}${pnl || 0}%</span>
                                </div>
                            </div>
                        </div>
                        <div class="text-xs text-zinc-400 mt-2 border-l-2 border-amber-900/50 pl-3 italic">${t.rationale || ''}</div>
                    </div>
                    `;
                }).join('');
            } else {
                openTacticalHTML = `<div class="text-zinc-500 py-4 italic px-2">No open high-conviction/tactical positions at the moment.</div>`;
            }

            // 3. Process Closed Core Trades Ledger
            const closedTrades = pData.closed_trades_history || [];
            let closedHTML = '';
            if (closedTrades.length > 0) {
                closedHTML = closedTrades.map(c => {
                    let rPnlColor = c.realized_pnl_inr >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    let rPnlSign = c.realized_pnl_inr > 0 ? '+' : '';
                    return `
                    <div class="flex justify-between items-center py-3 border-b border-zinc-800/50 last:border-0">
                        <div>
                            <div class="font-bold text-zinc-200">${c.ticker} <span class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded ml-2">${c.exit_reason || 'CLOSED'}</span></div>
                            <div class="text-xs text-zinc-500 font-mono mt-1">Exit: ₹${c.exit_price} (${c.exit_date})</div>
                        </div>
                        <div class="text-right">
                            <div class="${rPnlColor} font-bold font-mono">${rPnlSign}${formatINR(c.realized_pnl_inr)}</div>
                        </div>
                    </div>
                    `;
                }).join('');
            } else {
                closedHTML = `<div class="text-zinc-500 text-sm italic py-2">No closed core trades in this period.</div>`;
            }

            // 4. Process Closed Tactical Bets History
            const closedTactical = pData.closed_tactical_bets_history || [];
            let closedTacticalHTML = '';
            if (closedTactical.length > 0) {
                closedTacticalHTML = closedTactical.map(c => {
                    let rPnlColor = c.realized_pnl_inr >= 0 ? 'text-emerald-400' : 'text-rose-400';
                    let rPnlSign = c.realized_pnl_inr > 0 ? '+' : '';
                    return `
                    <div class="flex justify-between items-center py-3 border-b border-zinc-800/50 last:border-0">
                        <div>
                            <div class="font-bold text-zinc-200">${c.ticker} <span class="text-[10px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded ml-2">${c.exit_reason || 'CLOSED'}</span></div>
                            <div class="text-xs text-zinc-500 font-mono mt-1">Exit: ₹${c.exit_price} (${c.exit_date})</div>
                        </div>
                        <div class="text-right">
                            <div class="${rPnlColor} font-bold font-mono">${rPnlSign}${formatINR(c.realized_pnl_inr)}</div>
                        </div>
                    </div>
                    `;
                }).join('');
            } else {
                closedTacticalHTML = `<div class="text-zinc-500 text-sm italic py-2">No closed high-conviction trades in this period.</div>`;
            }

            const html = `
                <div class="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                    <!-- Accounting & Metrics Box -->
                    <div class="glass border border-zinc-700 rounded-3xl p-6 relative overflow-hidden shadow-xl">
                        <h2 class="text-xl font-semibold mb-6 flex items-center justify-between border-b border-zinc-800 pb-4">
                            <span>Portfolio Accounting</span>
                            <span class="text-[10px] font-mono text-zinc-400 bg-zinc-900 border border-zinc-700 px-2 py-1 rounded">NAV: ${nav ? '₹'+nav.toFixed(4) : '--'}</span>
                        </h2>
                        
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-y-8 gap-x-4">
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Cumulative Return</div>
                                <div class="text-3xl md:text-4xl font-bold font-mono ${ret >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${ret !== undefined ? ret + '%' : '--'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Est. CAGR</div>
                                <div class="text-3xl md:text-4xl font-bold font-mono">${metrics.cagr_pct !== undefined ? metrics.cagr_pct + '%' : '--'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Drawdown</div>
                                <div class="text-3xl md:text-4xl font-bold font-mono text-rose-400">${dd !== undefined ? dd + '%' : '--'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Core Win Rate</div>
                                <div class="text-3xl md:text-4xl font-bold font-mono mt-1">${winRate !== undefined ? winRate + '%' : '--'}</div>
                            </div>
                            
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Total AUM</div>
                                <div class="text-xl md:text-2xl font-bold font-mono text-sky-400">${aum ? formatINR(aum) : '--'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Cash Balance</div>
                                <div class="text-xl md:text-2xl font-bold font-mono text-zinc-300">${cashVal !== undefined ? formatINR(cashVal) : '--'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Tactical Win Rate</div>
                                <div class="text-xl md:text-2xl font-bold font-mono text-amber-400">${tacticalWinRate !== undefined ? tacticalWinRate + '%' : '--'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-[10px] md:text-xs text-zinc-500 uppercase tracking-widest font-semibold mb-1">Peak Value Date</div>
                                <div class="text-sm md:text-base font-bold font-mono mt-2">${metrics.peak_portfolio_value_date || '--'}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Context AI Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                            <h2 class="text-emerald-400 mb-3 text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-scale-balanced mr-2"></i>Benchmark Comparison</h2>
                            <p class="text-zinc-300 text-sm leading-relaxed">${pData.benchmark_comparison || '--'}</p>
                        </div>
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl">
                            <h2 class="text-sky-400 mb-3 text-sm font-bold tracking-widest uppercase"><i class="fa-solid fa-arrows-rotate mr-2"></i>Rebalancing Suggestion</h2>
                            <p class="text-zinc-300 text-sm leading-relaxed">${pData.rebalancing_suggestion || '--'}</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <!-- Chart Section -->
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl flex flex-col justify-center">
                            <h2 class="text-lg font-semibold mb-4 text-center">Asset Allocation</h2>
                            <div class="relative w-full aspect-square max-w-[250px] mx-auto">
                                <canvas id="allocationChart"></canvas>
                            </div>
                        </div>
                        
                        <!-- Open Positions -->
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl lg:col-span-2">
                            <h2 class="text-xl font-semibold mb-6 flex items-center justify-between border-b border-zinc-800 pb-4">
                                <span>Core Positions</span>
                                <span class="text-[10px] uppercase font-bold text-emerald-500 bg-emerald-950/50 border border-emerald-900 px-2 py-1 rounded">Live Data</span>
                            </h2>
                            <div class="space-y-1">${holdingsHTML || '<div class="text-zinc-500 py-4">No open core positions.</div>'}</div>
                        </div>
                    </div>

                    <!-- NEW: Tactical Bets Section -->
                    <div class="glass border border-amber-900/50 rounded-3xl p-6 shadow-xl bg-amber-950/10">
                        <h2 class="text-xl font-semibold mb-6 flex items-center justify-between border-b border-amber-900/50 pb-4">
                            <span><i class="fa-solid fa-bolt text-amber-500 mr-2"></i> High Conviction / Tactical Bets</span>
                            <span class="text-[10px] uppercase font-bold text-amber-500 bg-amber-950 border border-amber-900 px-2 py-1 rounded">Alpha Generation</span>
                        </h2>
                        <div class="space-y-1">${openTacticalHTML}</div>
                    </div>

                    <!-- NEW: Split Ledgers for History -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <!-- Core Trades History -->
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl bg-zinc-900/50">
                            <h2 class="text-lg font-semibold mb-4 text-zinc-400 flex items-center border-b border-zinc-800 pb-4">
                                <i class="fa-solid fa-book-journal-whills mr-2"></i> Core Trades History
                            </h2>
                            <div>${closedHTML}</div>
                        </div>

                        <!-- Tactical Bets History -->
                        <div class="glass border border-zinc-700 rounded-3xl p-6 shadow-xl bg-zinc-900/50">
                            <h2 class="text-lg font-semibold mb-4 text-zinc-400 flex items-center border-b border-zinc-800 pb-4">
                                <i class="fa-solid fa-bolt-lightning mr-2"></i> High Conviction History
                            </h2>
                            <div>${closedTacticalHTML}</div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById("dashboard-content").innerHTML = html;

            // Render Chart
            if (chart) chart.destroy();
            const ctx = document.getElementById('allocationChart');
            if (ctx && chartData.length > 0) {
                chart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: chartLabels,
                        datasets: [{ data: chartData, backgroundColor: ['#10b981','#f59e0b','#3b82f6','#8b5cf6','#ec4899','#f43f5e', '#06b6d4', '#14b8a6', '#84cc16', '#6366f1'], borderWidth: 0 }]
                    },
                    options: { 
                        responsive: true, 
                        maintainAspectRatio: false, 
                        cutout: '75%', 
                        plugins: { legend: { position: 'bottom', labels: { color: '#a1a1aa', padding: 15, font: {size: 10} } } } 
                    }
                });
            }
        }

        function renderOutlook() {
            if(!currentData) return;
            const outlook = currentData.one_week_outlook || {};
            const ideasHTML = (outlook.high_conviction_ideas || []).map(idea => `<li class="py-3 text-zinc-300 text-sm border-b border-zinc-800/50 last:border-0">• ${idea}</li>`).join('');
            
            const html = `
                <div class="glass border border-zinc-700 rounded-3xl p-6 space-y-8 animate-[fadeIn_0.3s_ease-out]">
                    <div>
                        <h2 class="text-2xl font-semibold mb-6">Forward Outlook</h2>
                        <div class="grid grid-cols-3 gap-4">
                            <div class="bg-zinc-900 p-5 rounded-2xl text-center shadow-inner border border-zinc-800/50">
                                <div class="text-[10px] md:text-xs text-zinc-500 font-bold tracking-widest mb-1">BIAS</div>
                                <div class="text-xl md:text-3xl font-bold text-emerald-400">${outlook.directional_bias || '--'}</div>
                            </div>
                            <div class="bg-zinc-900 p-5 rounded-2xl text-center shadow-inner border border-zinc-800/50">
                                <div class="text-[10px] md:text-xs text-zinc-500 font-bold tracking-widest mb-1">CONFIDENCE</div>
                                <div class="text-xl md:text-3xl font-bold">${outlook.confidence_percent || '--'}%</div>
                            </div>
                            <div class="bg-zinc-900 p-5 rounded-2xl text-center shadow-inner border border-zinc-800/50">
                                <div class="text-[10px] md:text-xs text-zinc-500 font-bold tracking-widest mb-1">RANGE</div>
                                <div class="text-sm md:text-xl font-medium mt-1 md:mt-0 font-mono">${outlook.expected_nifty_range || '--'}</div>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div class="bg-zinc-900/50 p-5 rounded-xl border border-zinc-800"><strong class="text-emerald-400 text-sm tracking-widest"><i class="fa-solid fa-bullseye mr-2"></i>BASE CASE</strong><p class="mt-2 text-sm text-zinc-300 leading-relaxed">${outlook.base_case || '--'}</p></div>
                        
                        <div class="grid md:grid-cols-2 gap-6">
                            <div class="bg-zinc-900/50 p-5 rounded-xl border border-zinc-800"><strong class="text-amber-400 text-sm tracking-widest"><i class="fa-solid fa-arrow-trend-up mr-2"></i>BULL CASE</strong><p class="mt-2 text-sm text-zinc-300 leading-relaxed">${outlook.bull_case || '--'}</p></div>
                            <div class="bg-zinc-900/50 p-5 rounded-xl border border-zinc-800"><strong class="text-rose-400 text-sm tracking-widest"><i class="fa-solid fa-arrow-trend-down mr-2"></i>BEAR CASE</strong><p class="mt-2 text-sm text-zinc-300 leading-relaxed">${outlook.bear_case || '--'}</p></div>
                        </div>
                    </div>
                    <div class="bg-zinc-900/30 p-5 rounded-xl border border-zinc-800/50">
                        <strong class="text-sky-400 tracking-widest text-sm"><i class="fa-solid fa-lightbulb mr-2"></i>HIGH CONVICTION OPTIONS / PAIR TRADES</strong>
                        <ul class="mt-2 pl-2">\n${ideasHTML || '<li class="text-zinc-500 py-2">No ideas provided.</li>'}</ul>
                    </div>
                </div>
            `;
            document.getElementById("dashboard-content").innerHTML = html;
        }

        function showTab(tab) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('nav-active'));
            document.getElementById(`tab-${tab}`).classList.add('nav-active');
            
            if (tab === 1) renderPortfolio();
            else if (tab === 2) renderOutlook();
            else renderOverview();
        }

        function updateDateSelector() {
            const select = document.getElementById("date-select");
            select.innerHTML = '';
            
            availableReports.forEach((file, i) => {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = file.replace(".json", "").replace(/_/g, " ");
                if (i === currentIndex) option.selected = true;
                select.appendChild(option);
            });
            
            select.onchange = () => {
                currentIndex = parseInt(select.value);
                loadReport(availableReports[currentIndex]);
            };

            document.getElementById('btn-prev').disabled = (currentIndex === 0);
            document.getElementById('btn-next').disabled = (currentIndex === availableReports.length - 1);
        }

        // Add fade-in CSS animation
        const style = document.createElement('style');
        style.innerHTML = `@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }`;
        document.head.appendChild(style);

        window.onload = () => loadReport(availableReports[currentIndex]);
    </script>
</body>
</html>
