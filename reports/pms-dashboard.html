<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', system-ui, sans-serif; }
        .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(16px); }
        .nav-active { border-bottom: 3px solid #22c55e; color: #22c55e; font-weight: 600; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .mobile-tab { font-size: 0.95rem; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 min-h-screen pb-20">
    <!-- Top Header -->
    <div class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-emerald-500 text-black font-bold rounded-2xl flex items-center justify-center text-2xl">P</div>
                <div>
                    <h1 class="text-2xl font-semibold">PMS Dashboard</h1>
                    <p class="text-xs text-emerald-400">30+ Years Experience</p>
                </div>
            </div>
            <select id="date-select" class="bg-zinc-800 text-sm border border-zinc-700 rounded-2xl px-4 py-2.5 focus:outline-none"></select>
        </div>
        
        <!-- Mobile Tabs -->
        <div class="flex border-t border-zinc-800 bg-zinc-900 overflow-x-auto">
            <button onclick="showTab(0)" id="tab-0" class="nav-active mobile-tab flex-1 py-4 text-center">Overview</button>
            <button onclick="showTab(1)" id="tab-1" class="mobile-tab flex-1 py-4 text-center text-zinc-400">Portfolio</button>
            <button onclick="showTab(2)" id="tab-2" class="mobile-tab flex-1 py-4 text-center text-zinc-400">Outlook</button>
        </div>
    </div>

    <div class="p-4 md:p-6 max-w-5xl mx-auto" id="dashboard-content"></div>

    <script>
        let currentData = null;
        let availableReports = ["28_Feb_2026.json","30_Apr_2026.json","31_Dec_2025.json","31_Jan_2026.json","31_Mar_2026.json","31_May_2026.json"];
        let currentIndex = 5;
        let chart = null;

        async function loadReport(filename) {
            try {
                const url = `https://raw.githubusercontent.com/dkraj0612/nse-delivery-data/main/reports/${filename}`;
                const res = await fetch(url);
                currentData = await res.json();
                showTab(0); // Default to Overview
                updateDateSelector();
            } catch(e) {
                console.error("Load failed", e);
            }
        }

        function renderOverview() {
            const html = `
                <div class="space-y-6">
                    <div class="glass border border-zinc-700 rounded-3xl p-6">
                        <h2 class="font-semibold text-lg mb-4 flex items-center gap-2"><i class="fas fa-chart-line"></i> Market Snapshot</h2>
                        <p class="text-zinc-300 leading-relaxed whitespace-pre-line">${currentData.market_snapshot?.text_summary || ''}</p>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="glass border border-zinc-700 rounded-3xl p-6">
                            <h2 class="text-amber-400 mb-4">KEY DRIVERS</h2>
                            <p class="text-zinc-300">${currentData.key_drivers?.text_summary || ''}</p>
                        </div>
                        <div class="glass border border-zinc-700 rounded-3xl p-6">
                            <h2 class="text-sky-400 mb-4">MIDCP ANALYSIS</h2>
                            <p class="text-zinc-300">${currentData.midcp_analysis?.text_summary || ''}</p>
                        </div>
                    </div>
                    
                    <div class="glass border border-zinc-700 rounded-3xl p-6">
                        <h2 class="text-rose-400 mb-4">SECTORAL OPTION FLOWS</h2>
                        <p class="text-zinc-300">${currentData.sectoral_option_flows?.text_summary || ''}</p>
                    </div>
                    
                    <div class="glass border border-zinc-700 rounded-3xl p-6">
                        <h2 class="text-sky-400 mb-4">X SENTIMENT</h2>
                        <p class="text-zinc-300">${currentData.x_sentiment?.text_summary || ''}</p>
                    </div>
                </div>
            `;
            document.getElementById("dashboard-content").innerHTML = html;
        }

        function renderPortfolio() {
            const holdings = currentData.model_portfolio?.portfolio_holdings || [];
            const metrics = currentData.model_portfolio?.metrics || {};
            
            let holdingsHTML = holdings.map(h => `
                <div class="border-b border-zinc-800 py-5 last:border-none">
                    <div class="flex justify-between">
                        <div>
                            <div class="font-semibold">${h.stock_name}</div>
                            <div class="text-emerald-400 font-mono text-sm">${h.ticker}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-xl font-bold">${h.allocation_pct}%</div>
                        </div>
                    </div>
                    <div class="text-xs text-zinc-400 mt-2">${h.rationale || ''}</div>
                </div>
            `).join('');

            const html = `
                <div class="space-y-8">
                    <!-- Portfolio Level Metrics -->
                    <div class="glass border border-zinc-700 rounded-3xl p-6">
                        <h2 class="text-xl font-semibold mb-6">Portfolio Performance Metrics</h2>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
                            <div class="text-center">
                                <div class="text-xs text-zinc-400">TOTAL RETURN</div>
                                <div class="text-3xl font-bold text-emerald-400">${metrics.total_return_pct || 0}%</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-zinc-400">CAGR</div>
                                <div class="text-3xl font-bold">${metrics.cagr_pct || 0}%</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-zinc-400">MAX DRAWDOWN</div>
                                <div class="text-3xl font-bold text-rose-400">${metrics.max_drawdown_pct || 0}%</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-zinc-400">SHARPE RATIO</div>
                                <div class="text-3xl font-bold">${metrics.sharpe_ratio || 'N/A'}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-zinc-400">VOLATILITY</div>
                                <div class="text-3xl font-bold">${metrics.volatility || 0}%</div>
                            </div>
                            <div class="text-center">
                                <div class="text-xs text-zinc-400">BETA TO NIFTY</div>
                                <div class="text-3xl font-bold">${metrics.beta_to_nifty || 0}</div>
                            </div>
                        </div>
                    </div>

                    <!-- Holdings -->
                    <div class="glass border border-zinc-700 rounded-3xl p-6">
                        <h2 class="text-xl font-semibold mb-6">Model Portfolio Holdings</h2>
                        <div class="space-y-1">${holdingsHTML}</div>
                    </div>

                    <!-- Sector Allocation -->
                    <div class="glass border border-zinc-700 rounded-3xl p-6">
                        <h2 class="text-xl font-semibold mb-6">Sector Allocation</h2>
                        <canvas id="sectorChart" class="h-64"></canvas>
                    </div>
                </div>
            `;
            document.getElementById("dashboard-content").innerHTML = html;

            // Render Sector Chart
            if (chart) chart.destroy();
            const ctx = document.getElementById('sectorChart');
            if (ctx) {
                const sectorAlloc = metrics.sector_allocation || {};
                chart = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(sectorAlloc),
                        datasets: [{ data: Object.values(sectorAlloc), backgroundColor: ['#22c55e','#eab308','#3b82f6','#a855f7','#ec4899','#f43f5e'] }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#ddd', padding: 20 } } } }
                });
            }
        }

        function renderOutlook() {
            const outlook = currentData.one_week_outlook || {};
            const ideasHTML = (outlook.high_conviction_ideas || []).map(idea => `<li class="py-2 text-zinc-300">• ${idea}</li>`).join('');
            
            const html = `
                <div class="glass border border-zinc-700 rounded-3xl p-6 space-y-8">
                    <div>
                        <h2 class="text-2xl font-semibold mb-6">One Week Outlook</h2>
                        <div class="grid grid-cols-3 gap-4">
                            <div class="bg-zinc-900 p-5 rounded-2xl text-center">
                                <div class="text-xs text-zinc-400">BIAS</div>
                                <div class="text-3xl font-bold text-emerald-400">${outlook.directional_bias || 'N/A'}</div>
                            </div>
                            <div class="bg-zinc-900 p-5 rounded-2xl text-center">
                                <div class="text-xs text-zinc-400">CONFIDENCE</div>
                                <div class="text-3xl font-bold">${outlook.confidence_percent || 0}%</div>
                            </div>
                            <div class="bg-zinc-900 p-5 rounded-2xl text-center">
                                <div class="text-xs text-zinc-400">RANGE</div>
                                <div class="font-medium">${outlook.expected_nifty_range || 'N/A'}</div>
                            </div>
                        </div>
                    </div>
                    <div class="space-y-6">
                        <div><strong class="text-emerald-400">BASE CASE</strong><p class="mt-2">${outlook.base_case || ''}</p></div>
                        <div class="grid md:grid-cols-2 gap-6">
                            <div><strong class="text-amber-400">BULL CASE</strong><p class="mt-2">${outlook.bull_case || ''}</p></div>
                            <div><strong class="text-rose-400">BEAR CASE</strong><p class="mt-2">${outlook.bear_case || ''}</p></div>
                        </div>
                    </div>
                    <div>
                        <strong>HIGH CONVICTION IDEAS</strong>
                        <ul class="mt-4 pl-5 space-y-3 list-disc">${ideasHTML}</ul>
                    </div>
                </div>
            `;
            document.getElementById("dashboard-content").innerHTML = html;
        }

        function showTab(tab) {
            document.querySelectorAll('[id^="tab-"]').forEach(el => el.classList.remove('nav-active'));
            document.getElementById(`tab-${tab}`).classList.add('nav-active');
            
            if (tab === 1) renderPortfolio();
            else if (tab === 2) renderOutlook();
            else renderOverview();
        }

        function updateDateSelector() {
            const select = document.getElementById("date-select");
            select.innerHTML = '';
            availableReports.forEach((file, i) => {
                const option = document.createElement("option");
                option.value = i;
                option.textContent = file.replace(".json", "").replace(/_/g, " ");
                if (i === currentIndex) option.selected = true;
                select.appendChild(option);
            });
            select.onchange = () => {
                currentIndex = parseInt(select.value);
                loadReport(availableReports[currentIndex]);
            };
        }

        window.onload = () => loadReport(availableReports[currentIndex]);
    </script>
</body>
</html>
